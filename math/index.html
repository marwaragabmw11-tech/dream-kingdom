<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amina’s Math Kitchen · مطبخ أمينة للرياضيات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ef;--card:#ffffff;--ink:#2d2a32;--soft:#7a6f7e;--line:#f0e2cf;--brand:#ff7a59;--brand2:#2ec4b6;--sun:#ffd166;--ok:#2bb673;--bad:#e5484d;--sh:0 6px 0 rgba(0,0,0,.06),0 10px 24px rgba(120,80,40,.10);--r:22px}
.dark{--bg:#1d1b26;--card:#2a2736;--ink:#f6f1ff;--soft:#b6aec6;--line:#3b3650;--sh:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.3)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.7 'Baloo Bhaijaan 2','Baloo 2',system-ui,sans-serif}
body{background-image:radial-gradient(circle at 10% 0,#ffe2d4 0,transparent 40%),radial-gradient(circle at 100% 30%,#d9f6f3 0,transparent 35%);background-attachment:fixed;min-height:100vh}
.dark body,body.dark{background-image:none}
[dir=ltr],.m,.inp,.qtext{font-family:'Baloo 2','Baloo Bhaijaan 2',system-ui,sans-serif}
.m{unicode-bidi:isolate;display:inline!important;font-size:inherit!important}
button{font:inherit;color:inherit;cursor:pointer}
.hide{display:none!important}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px calc(10px);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:2px dashed var(--line)}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;min-width:0;display:flex;align-items:center;gap:8px;cursor:pointer}
header h1 svg{width:40px;height:40px}
.pill{background:var(--card);border-radius:99px;padding:4px 12px;box-shadow:var(--sh);font-weight:800;white-space:nowrap}
.icon{background:var(--card);border:0;border-radius:14px;width:40px;height:40px;box-shadow:var(--sh);font-size:18px;flex:none}
main{max-width:860px;margin:0 auto;padding:16px 14px 110px}
nav.tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);box-shadow:0 -6px 20px rgba(0,0,0,.08);padding:6px 4px calc(6px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:12.5px;font-weight:700;color:var(--soft);padding:4px 6px;border-radius:14px;min-width:62px}
nav.tabs button b{font-size:22px;line-height:1.2}
nav.tabs button.on{color:var(--brand);background:color-mix(in srgb,var(--brand) 12%,transparent)}
h2{font-size:24px;margin:6px 0 12px}
h3{font-size:19px;margin:4px 0 8px}
.say{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 0;box-shadow:var(--sh)}
.say.big{font-size:22px;font-weight:800;text-align:center}
.mini{color:var(--soft);font-size:15px;margin:6px 0}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#ffb38a,#ff7a59);color:#fff;border-radius:28px;padding:16px;box-shadow:var(--sh);margin-bottom:16px}
.hero svg{width:110px;height:110px;flex:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.15))}
.hero p{margin:4px 0}
.hero b.big{font-size:23px;display:block}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{border:0;border-radius:var(--r);padding:16px 12px;background:var(--card);box-shadow:var(--sh);text-align:center;transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile b{display:block;font-size:40px;line-height:1.2}
.tile span{font-weight:800;font-size:17px;display:block}
.tile small{color:var(--soft);font-size:13px}
.item.uexam{border:2.5px solid #ff7a59;background:#fff4ef}
.usec{margin:18px 0 6px;padding:4px 12px;background:#f1eee8;border-radius:10px;font-size:17px}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.unit{border:0;border-radius:var(--r);padding:14px;color:#fff;text-align:start;box-shadow:var(--sh);position:relative;overflow:hidden;min-height:118px}
.unit b{font-size:34px;display:block;line-height:1.1}
.unit span{font-weight:800;display:block}
.unit small{opacity:.9;font-family:'Baloo 2',system-ui,sans-serif;display:block}
.unit em{position:absolute;inset-inline-end:10px;top:8px;font-style:normal;background:rgba(0,0,0,.5);color:#fff;font-weight:800;border-radius:99px;padding:0 8px;font-size:13px}
.lesson{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);margin:14px 0;overflow:hidden}
.lhead{padding:12px 16px;color:#fff;display:flex;align-items:center;gap:8px}
.lhead h3{margin:0;flex:1}
.lhead small{font-family:'Baloo 2',system-ui,sans-serif;opacity:.9}
.ways{display:flex;gap:6px;padding:10px 10px 0;overflow-x:auto;scrollbar-width:none}
.ways button{border:0;border-radius:99px;padding:6px 12px;background:var(--bg);font-weight:700;white-space:nowrap;font-size:15px}
.ways button.on{background:var(--ink);color:var(--card)}
.wbody{padding:12px 16px 16px;min-height:120px}
.wbody ol{padding-inline-start:22px;margin:4px 0}
.wbody li{margin:6px 0}
.cap{text-align:center;color:var(--soft);font-size:15px;margin:8px 0 0}
.trick{background:#fff3c4;color:#5b4500;border-radius:16px;padding:12px;border:2px dashed #f6c343}
.dark .trick{background:#40361a;color:#ffe9a8}
/* pictures */
.pv{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.pv{flex-wrap:nowrap!important}.pvg{display:grid;grid-template-columns:repeat(3,28px);gap:3px;text-align:center;border-radius:14px;padding:6px}
.pvg b{grid-column:1/4;font-size:13px}
.pvg span{font-size:12px;opacity:.7}
.pvg i{font-style:normal;font-weight:800;font-size:19px;background:var(--card);border-radius:8px}
.pvg.m{background:#ffe0e6}.pvg.t{background:#dff3ff}.pvg.o{background:#e3fbe8}
.dark .pvg.m{background:#4a2b33}.dark .pvg.t{background:#22394a}.dark .pvg.o{background:#243d2b}
.hl{color:#e5484d;outline:3px solid #e5484d;border-radius:8px}
.hl2{color:#3c6382}
.three,.props,.ladder,.order,.pc,.hops,.tape{display:grid;gap:8px}
.three>div,.props>div,.ladder>div,.order>div,.pc>div,.hops>div{background:var(--bg);border-radius:14px;padding:8px 12px;text-align:center;font-weight:700}
.three b,.props b{display:block;color:var(--brand)}
.cmp{display:flex;gap:12px;justify-content:center;align-items:center;font-size:30px;font-weight:800}
.cmp .sign{color:var(--brand);font-size:40px}
.nl{display:flex;align-items:center;gap:8px;font-weight:800}
.nl .line{flex:1;height:6px;background:var(--ink);border-radius:9px;position:relative;margin:28px 0}
.nl i{position:absolute;top:-30px;transform:translateX(-50%);font-style:normal;font-size:14px;white-space:nowrap}
.nl i.dot::after{content:'';position:absolute;left:50%;top:26px;width:14px;height:14px;background:var(--brand);border-radius:50%;transform:translateX(-50%)}
.nl i.mid{top:14px;color:var(--soft)}
.colx{width:max-content;margin:auto;font-size:26px;font-weight:800;text-align:right;letter-spacing:4px}
.colx .cr{font-size:15px;color:var(--brand);letter-spacing:2px}
.colx .ln{border-top:3px solid var(--ink);color:var(--ok)}
.colx s{text-decoration-color:var(--bad)}
.tl{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;font-weight:800}
.tl span{background:var(--sun);color:#3d2c00;border-radius:12px;padding:2px 10px}
.tl i{font-style:normal;color:var(--soft);font-size:14px}
.rect{width:220px;height:110px;margin:20px auto 10px;border:4px solid var(--brand);border-radius:6px;position:relative;background:color-mix(in srgb,var(--brand) 12%,transparent)}
.rect .w{position:absolute;top:-30px;left:50%;transform:translateX(-50%);font-weight:800}
.rect .h{position:absolute;left:-62px;top:50%;transform:translateY(-50%);font-weight:800}
.grid53{display:grid;grid-template-columns:repeat(5,34px);gap:3px;width:max-content;margin:auto}
.grid53 i{height:34px;background:var(--brand2);border-radius:6px;opacity:.85}
.tape>div{display:flex;gap:4px;align-items:center}
.tape b{width:36px;font-size:24px}
.tape i{font-style:normal;background:var(--sun);color:#3d2c00;border-radius:8px;padding:2px 0;width:52px;text-align:center;font-weight:800}
.arr{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.cookies{display:grid;gap:2px}.cookies.r3{grid-template-columns:repeat(5,1fr)}.cookies.r5{grid-template-columns:repeat(3,1fr)}
.cookies i{font-style:normal;font-size:20px}
.rainbow{position:relative;display:flex;justify-content:space-between;max-width:300px;margin:auto;font-weight:800;font-size:22px;padding:0 10px}
.rainbow svg{position:absolute;inset:26px 0 auto;width:100%;height:70px;fill:none;stroke-width:4;stroke-linecap:round}
.rainbow{padding-bottom:70px}
.a1{stroke:#e55039}.a2{stroke:#f6b93b}.a3{stroke:#38ada9}
.pc .p{background:#e3fbe8}.pc .c{background:#ffe0e6}.dark .pc .p{background:#243d2b}.dark .pc .c{background:#4a2b33}
.hops b{color:var(--brand)}
.fig{overflow:visible;width:100%;max-width:340px;display:block;margin:auto}
.fig .shape{fill:color-mix(in srgb,var(--brand2) 25%,transparent);stroke:var(--brand2);stroke-width:3}
.fig text{font:800 14px 'Baloo 2',system-ui,sans-serif;fill:var(--ink)}
.fig .cut{stroke:var(--brand);stroke-width:3}
.figw{margin:10px 0}
/* quiz cards */
.qcard{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px 14px;margin:12px 0;border:3px solid transparent}
.qcard.done{border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.qcard.pulse{animation:pulse .6s}
@keyframes pulse{50%{transform:scale(1.02)}}
.qhead{display:flex;align-items:center;gap:8px}
.qn{background:var(--brand);color:#fff;border-radius:99px;min-width:30px;text-align:center;font-weight:800;padding:0 8px}
.qstar{flex:1;font-size:20px}
.qhead .icon{width:36px;height:36px}
.qtext{font-size:18px;font-weight:700;margin:8px 0;line-height:1.55}
.qbody{margin:6px 0}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:6px 0}
.plab{font-weight:700;color:var(--soft)}
.uni{font-weight:800;color:var(--soft)}
.inp{font-size:20px;font-weight:800;border:3px solid var(--line);background:var(--bg);color:var(--ink);border-radius:14px;padding:6px 10px;width:150px;text-align:center;outline:none}
.inp:focus{border-color:var(--brand2)}
.inp.wide{width:100%;max-width:520px;text-align:left}
.inp.ok,.opt.ok,.oline.ok{border-color:var(--ok)!important;background:color-mix(in srgb,var(--ok) 14%,var(--card))!important}
.inp.bad,.opt.bad,.oline.bad{border-color:var(--bad)!important;background:color-mix(in srgb,var(--bad) 12%,var(--card))!important;animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.opts.small{grid-template-columns:1fr 1fr}
.opt{border:3px solid var(--line);background:var(--bg);border-radius:16px;padding:8px 10px;font-weight:800;font-size:17px;text-align:start}
.opt.sel{border-color:var(--brand2)}
.ol{color:var(--soft)}
.qbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.btn{border:0;border-radius:16px;padding:8px 16px;background:var(--brand);color:#fff;font-weight:800;box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.ghost{background:var(--bg);color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #1b7a4c}
.btn.sm{padding:4px 10px;font-size:14px}
.btn.big{font-size:22px;padding:12px 28px;display:block;margin:12px auto}
.btn:disabled{opacity:.5}
.fb{font-weight:800;margin-top:8px;min-height:1px}
.fb.good{color:var(--ok)}.fb.bad{color:var(--bad)}.fb.info{color:var(--soft)}
.steps{background:color-mix(in srgb,var(--brand2) 10%,var(--card));border-radius:16px;padding:8px 12px;margin-top:10px}
.slist{margin:0;padding-inline-start:22px}
.slist li{margin:5px 0;animation:fadein .35s}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{border:3px solid var(--line);background:var(--bg);border-radius:99px;padding:4px 14px;font-weight:800;font-size:17px}
.chip:disabled{opacity:.35}
.chip.sel{background:var(--brand2);border-color:var(--brand2);color:#fff}
.oline{border:3px dashed var(--line);border-radius:14px;padding:6px 10px;min-height:44px;font-weight:800;margin:6px 0}
.oline i{color:var(--brand);font-style:normal;margin:0 6px}
.oline em{color:var(--soft);font-style:normal;font-weight:500}
.colgrid{display:grid;grid-template-columns:repeat(var(--n),44px);gap:4px;width:max-content;margin:10px auto;font-size:26px;font-weight:800;text-align:center}
.cc{height:44px;display:flex;align-items:center;justify-content:center}
.cc.op{color:var(--brand)}
.cc.cr{height:30px}
.cc.ul{border-bottom:3px solid var(--ink)}
.inp.dig{width:42px;height:44px;padding:0;font-size:24px}
.inp.carry{width:34px;height:28px;padding:0;font-size:14px;border-width:2px;border-style:dashed}
.note{width:100%;min-height:70px;border:3px dashed var(--line);border-radius:14px;background:var(--bg);color:var(--ink);font:inherit;padding:8px}
.model{background:var(--bg);border-radius:14px;padding:10px;margin-top:8px}
.barm{max-width:420px;margin:10px auto}
.btot{text-align:center;font-weight:800;border:2px solid var(--soft);border-bottom:0;border-radius:10px 10px 0 0;padding:2px;margin-bottom:4px}
.bbar{display:flex;height:48px;border-radius:12px;overflow:hidden;font-weight:800}
.bp{background:var(--sun);color:#3d2c00;display:flex;align-items:center;justify-content:center}
.bx{flex:1;background:var(--brand2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:20px}
.amodel{display:grid;grid-template-columns:auto 1fr;gap:4px;max-width:340px;margin:auto;font-weight:800}
.amodel .aside{grid-row:1;display:flex;align-items:center;font-size:20px;padding:0 6px}
.acells{display:flex;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.acell{flex:1;text-align:center;padding:10px 4px;border-inline-start:2px solid var(--ink);background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.acell:first-child{border:0}
.abot{grid-column:2;display:flex}
.abot div{flex:1;text-align:center}
.abot .q{color:var(--bad);font-size:22px}
.areaw{max-width:440px;margin:10px auto}
.atop,.arow{display:flex;gap:4px}
.atl{text-align:center;font-weight:800}
.aside2{width:36px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex:none}
.abox{flex:1;display:flex;border:3px solid var(--ink);border-radius:10px;overflow:hidden;min-height:110px}
.ab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px 2px;border-inline-start:2px solid var(--ink);font-weight:800;font-size:20px}
.ab:first-child{border:0}
.ab.c0{background:#ffe0d6}.ab.c1{background:#d6f5f2}.ab.c2{background:#fff1c1}.ab.c3{background:#e6dcff}
.dark .ab.c0{background:#4a3028}.dark .ab.c1{background:#21403c}.dark .ab.c2{background:#45391a}.dark .ab.c3{background:#352c4d}
.abl{font-size:13px;color:var(--soft)}
.ab .inp{width:84%;max-width:110px;font-size:18px;padding:4px}
.eqline{font-weight:800;font-size:18px;text-align:center;margin:8px 0;overflow-x:auto}
.pprow{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.pprow .inp{width:100px}
.plus{font-weight:800;font-size:22px}
.pp{width:max-content;margin:8px auto;font-weight:800;font-size:20px}
.pph{display:flex;flex-direction:column;align-items:flex-end;border-bottom:3px solid var(--ink);padding-bottom:4px;margin-bottom:6px}
.ppr{display:flex;align-items:center;gap:8px;justify-content:flex-end;margin:4px 0}
.ppl{color:var(--soft);font-size:16px}
.ppr .inp{width:110px}
.ppr.tot{border-top:3px solid var(--ink);padding-top:4px}
.demo .ab,.demo .ppr b{font-size:20px}
.list .item{display:flex;align-items:center;gap:10px;background:var(--card);border:0;width:100%;text-align:start;border-radius:18px;box-shadow:var(--sh);padding:12px 14px;margin:10px 0}
.item b{font-size:28px}
.item div{flex:1}
.item small{color:var(--soft);display:block;font-size:13px}
.item .pill{box-shadow:none;background:var(--bg)}
.models{display:flex;gap:8px;margin:8px 0}
.models button{flex:1;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px;font-weight:800}
.models button.on{border-color:var(--brand);background:var(--brand);color:#fff}
.back{border:0;background:none;color:var(--brand);font-weight:800;padding:0;margin-bottom:6px}
.section{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:14px 0}
.section h3{display:flex;gap:8px;align-items:center}
/* japanese */
.jpctl{display:flex;align-items:center;justify-content:center;gap:8px}
.jpctl .inp{width:90px}
.jpctl .x{font-size:28px;font-weight:800}
.jpstage{max-width:380px;margin:8px auto}
.jpsvg{width:100%;display:block}
.jpsvg line{stroke-width:3.2;stroke-linecap:round;transition:opacity .6s}
.jpsvg line.zero{stroke-dasharray:4 6;opacity:.35}
.jpsvg circle{fill:#999;transition:opacity .5s,r .3s;stroke:#fff;stroke-width:1.2}
.jpsvg circle.glow{r:6;stroke:#000;stroke-width:1.5}
.jpinfo{max-height:340px;overflow:auto}
/* fingers */
.hands{display:flex;justify-content:center;align-items:flex-end;gap:5px;height:120px;margin:10px 0}
.finger{width:26px;height:var(--h);border:0;border-radius:14px 14px 8px 8px;background:#ffcfa8;box-shadow:inset 0 -6px 0 rgba(0,0,0,.08);display:flex;align-items:flex-start;justify-content:center;padding-top:6px;font-weight:800;font-size:13px;color:#7a4a2a;transition:height .25s}
.finger.down{height:24px;background:#e55039;color:#fff}
.finger.left{background:#ffd166}
.handgap{width:20px}
/* table */
.tgrid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px;max-width:520px;margin:auto}
.th{text-align:center;font-weight:800;color:var(--brand);font-size:14px;padding:4px 0}
.tc{border:0;border-radius:8px;font-weight:800;font-size:14px;padding:6px 0;color:#2d2a32}
.tc.on{outline:3px solid var(--ink);transform:scale(1.12)}
/* game */
.rocket{height:16px;background:var(--bg);border-radius:99px;position:relative;margin:24px 6px 10px}
.rocket i{position:absolute;inset-block:0;inset-inline-start:0;background:var(--brand2);border-radius:99px;transition:width .4s}
.rocket span{position:absolute;top:-22px;font-size:24px;transition:inset-inline-start .4s;transform:scaleX(-1)}
.gq{text-align:center;font-size:44px;font-weight:800}
.gdisp{text-align:center;font-size:40px;font-weight:800;color:var(--brand);min-height:60px}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:300px;margin:auto}
.key{border:0;border-radius:16px;background:var(--bg);font-size:26px;font-weight:800;padding:10px 0;box-shadow:0 4px 0 var(--line)}
.key.go{background:var(--ok);color:#fff;box-shadow:0 4px 0 #1b7a4c}
/* welcome */
#welcome{position:fixed;inset:0;z-index:50;background:rgba(30,20,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
#welcome .wbox{background:var(--card);border-radius:28px;max-width:520px;width:100%;max-height:90vh;overflow:auto;padding:18px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;animation:pop .45s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
#welcome svg{width:130px;height:130px}
#welcome p{text-align:start;margin:8px 0}
.mascot .tail{transform-origin:150px 150px;animation:wag 2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(-12deg)}}
.mascot .eye{animation:blink 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
header h1 .face{width:42px;height:42px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:var(--sh)}
.heroimg{width:120px;height:120px;border-radius:24px;object-fit:cover;flex:none;border:4px solid rgba(255,255,255,.7)}
.wimg{width:100%;border-radius:20px;display:block}
.unit{padding:0!important;background-color:#fff;display:flex;flex-direction:column}

.unit span,.unit small{padding:0 12px}
.unit span{padding-top:8px}
.unit small{padding-bottom:10px}
.ubanner{border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);margin:6px 0 10px;max-height:300px}
.ubanner img{width:100%;height:300px;object-fit:cover;object-position:top;display:block}
.ubanner.wide img{object-fit:contain;background:#fff;height:240px}
.stars-big{font-size:46px;font-weight:800;text-align:center}
.prog{height:12px;background:var(--bg);border-radius:9px;overflow:hidden;margin:4px 0}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--brand));border-radius:9px}
.flag{font-size:13px;color:var(--soft)}
@media (max-width:420px){.opts{grid-template-columns:1fr}.tiles .tile b{font-size:34px}.heroimg{width:92px;height:92px}.units{grid-template-columns:1fr 1fr}}
/* language help + print */
.langb{border:2px solid var(--brand2);background:var(--card);color:var(--brand2);border-radius:99px;padding:2px 12px;font-weight:800;font-size:14px;font-family:'Baloo Bhaijaan 2','Baloo 2',sans-serif}
.stop{display:flex;justify-content:flex-end;margin-bottom:2px}

.arbtn{display:inline-flex;gap:6px;align-items:center;margin-top:8px}

.back{font-size:16px}

<body>
<header>
  <h1 id="home-t"><span id="mhead"></span>Amina’s Kitchen 🍳</h1>
  <span class="pill" id="starpill">⭐ 0</span>
  <button class="icon" id="arT" title="Explain in Arabic · الشرح بالعربي" style="font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800">ع</button>
  <button class="icon" id="openW" title="Mishmish’s message">💌</button>
  <button class="icon" id="theme" title="Dark mode">🌙</button>
</header>
<main id="app"></main>
<nav class="tabs" id="tabs">
  <button data-v="home"><b>🏠</b>Home</button>
  <button data-v="learn"><b>📚</b>Learn</button>
  <button data-v="times"><b>✖️</b>Times</button>
  <button data-v="quiz"><b>📝</b>Quizzes</button>
  <button data-v="month"><b>🏆</b>Monthly</button>
</nav>
<div id="welcome" class="hide"><div class="wbox">
  <div id="wm"></div>
  <div id="wtext"></div>
  <button class="langb" id="wLang"></button>
  <button class="btn big" id="wGo">Let’s cook numbers! 🍳</button>
</div></div>
<script src="engine.js"></script>
<script src="learn.js"></script>
<script src="learn_en.js"></script>
<script src="times.js"></script>
<script src="q1.js"></script>
<script src="q2.js"></script>
<script src="q3.js"></script>
<script src="q4.js"></script>
<script src="q5.js"></script>
<script src="qm1.js"></script>
<script src="qm2.js"></script>
<script src="steps_en.js"></script>
<script src="../shared/print.js"></script>
<script src="mprint.js"></script>
<script>
(function(){
const E = ENG, H = E.H, S = E.S, L = E.L, app = document.getElementById('app');
document.getElementById('mhead').innerHTML = '<img class="face" src="img/face.webp" alt="Mishmish">';
document.getElementById('wm').innerHTML = '<img class="wimg" src="img/cake.webp" alt="Chef Mishmish decorating a cake">';

/* ---- data indexes ---- */
const WEEKS = [];
UNITS.forEach(u => (QUIZ[u.id] || []).forEach(w => WEEKS.push(Object.assign({ unit: u }, w))));
const totalQ = w => Object.values(w.models).reduce((s, m) => s + m.length, 0);
const wStars = w => E.starCount('w:' + w.id + ':');
const mStars = m => E.starCount('m:' + m.id + ':');

/* ---- star pill ---- */
const pill = document.getElementById('starpill');
const upd = () => pill.textContent = '⭐ ' + E.starCount();
E.onStar = () => { upd(); pill.animate([{ transform: 'scale(1.4)' }, { transform: 'scale(1)' }], 400); };
upd();

/* ---- theme ---- */
const th = document.getElementById('theme');
const setTheme = d => { document.documentElement.classList.toggle('dark', d); document.body.classList.toggle('dark', d); th.textContent = d ? '☀️' : '🌙'; S.dark = d; E.save(); };
setTheme(S.dark != null ? S.dark : matchMedia('(prefers-color-scheme: dark)').matches);
th.onclick = () => setTheme(!S.dark);

/* ---- Arabic help (explanations in Arabic on request) ---- */
const arT = document.getElementById('arT');
const paintAr = () => { arT.classList.toggle('on', E.isAr()); arT.title = E.isAr() ? 'Arabic help is ON · الشرح بالعربي شغّال' : 'Explain in Arabic · الشرح بالعربي'; };
arT.onclick = () => { E.setAr(!E.isAr()); paintAr(); E.pop(); go(cur.v, cur.a, cur.b, true); toast(E.isAr() ? 'الشرح بقى بالعربي 🇪🇬 (الأسئلة زي ما هي بالإنجليزي)' : 'Explanations are in English now 🇬🇧'); };
paintAr();
function toast(t) { const d = H('div', 'say', t); d.dir = 'auto'; Object.assign(d.style, { position: 'fixed', insetInline: '12px', bottom: '84px', zIndex: 60, textAlign: 'center', fontWeight: 800 }); document.body.appendChild(d); setTimeout(() => d.remove(), 2200); }

/* ---- welcome ---- */
const WEL = {
  en: `<h2>Hi Amina! 👋</h2>
  <p>I’m <b>Chef Mishmish</b> 🐱👩‍🍳, and this is my kitchen where we cook numbers!</p>
  <p>I know your brain is <b>super fast</b> and you solve things in your head straight away… that’s a real superpower! 🦸‍♀️</p>
  <p>But do you know a secret? <b>Steps are like a recipe</b> 📝. A good chef writes her recipe so anyone can make the same yummy cake, and when your teacher sees the recipe she knows you understand and aren’t guessing. That’s why every answer here has a little “recipe” after it.</p>
  <p>Maths is hiding in everything you love: 🍰 cooking amounts, 🎨 shapes and areas in drawing, 🎮 points in games, and 🐶 even sharing food between animals is division!</p>
  <p>Here you’ll find: 📚 lessons explained in many ways (a story, a picture, steps, a trick), ✖️ the Japanese multiplication method and quick tricks, 📝 quizzes exactly like school, and 🏆 the monthly exams. And 🖨️ you can print any quiz and solve it on paper.</p>
  <p>Need it in Arabic? Tap the <b>ع</b> button at the top, or the <b>ع</b> button on any explanation 🇪🇬.</p>
  <p>Every right answer = ⭐. And if you make a mistake? <b>That’s totally fine</b> 🌸 nobody sees it but you, and mistakes are what make your brain grow.</p>`,
  ar: `<h2>أهلاً يا أمينة! 👋</h2>
  <p>أنا <b>الشيف مِشمِش</b> 🐱👩‍🍳، وده مطبخي اللي بنطبخ فيه الأرقام!</p>
  <p>عرفت إن دماغك <b>سريعة جداً</b> وبتحلي في دماغك على طول… دي قوة خارقة بجد! 🦸‍♀️</p>
  <p>بس تعرفي سر؟ <b>الخطوات زي الوصفة</b> 📝. الشيف الشاطرة بتكتب وصفتها علشان أي حد يقدر يعمل نفس الكيكة الحلوة، والمدرّسة لما تشوف الوصفة بتعرف إنك فاهمة مش بتخمّني. علشان كده كل إجابة هنا بعدها "وصفة" صغيرة.</p>
  <p>والرياضة مستخبية في كل حاجة بتحبيها: 🍰 مقادير الطبخ، 🎨 الأشكال والمساحات في الرسم، 🎮 النقط في الألعاب، و🐶 حتى أكل الحيوانات بيتوزع بالقسمة!</p>
  <p>هنا هتلاقي: 📚 شرح بكذا طريقة (حكاية، صورة، خطوات، حيلة)، ✖️ جدول الضرب بالطريقة اليابانية وحيل سريعة، 📝 كويزات زي اللي في المدرسة بالظبط، و🏆 امتحانات الشهر. وكمان 🖨️ تقدري تطبعي أي كويز وتحليه على الورق.</p>
  <p>الصفحة بالإنجليزي زي كتابك، ولو عايزة الشرح بالعربي اضغطي زرار <b>ع</b> فوق، أو زرار <b>ع</b> اللي جنب أي شرح 🇪🇬.</p>
  <p>وكل إجابة صح = ⭐. ولو غلطتي؟ <b>عادي جداً</b> 🌸 الغلط هنا محدش بيشوفه غيرك، وهو اللي بيخلّي الدماغ تكبر.</p>`
};
const W = document.getElementById('welcome'), wt = document.getElementById('wtext'), wl = document.getElementById('wLang');
let wAr = false;
const paintW = () => { wt.innerHTML = ''; wt.appendChild(E.tx(WEL.en, WEL.ar, '', 'div', wAr)); wl.textContent = wAr ? 'English' : 'ع  اقري بالعربي'; };
wl.onclick = () => { wAr = !wAr; paintW(); };
document.getElementById('openW').onclick = () => { wAr = E.isAr(); paintW(); W.classList.remove('hide'); };
document.getElementById('wGo').onclick = () => { W.classList.add('hide'); S.welcomed = 1; E.save(); E.ding(); };
if (!S.welcomed) { wAr = E.isAr(); paintW(); W.classList.remove('hide'); }

/* ---- small helpers ---- */
/* a block with its own English/Arabic switch (Arabic only when asked) */
function biBlock(en, ar, cls) {
  const wrap = H('div', cls || ''); let useAr = E.isAr() && ar != null;
  const body = H('div'), sw = H('button', 'langb');
  const paint = () => { body.innerHTML = ''; body.appendChild(E.tx(en, ar, '', 'div', useAr)); sw.textContent = useAr ? 'English' : 'ع  اشرحي بالعربي'; };
  sw.onclick = () => { useAr = !useAr; paint(); E.pop(); };
  wrap.append(body); if (ar != null && en != null) { const r = H('div', 'arbtn'); r.appendChild(sw); wrap.appendChild(r); }
  paint(); return wrap;
}
const printBtn = (qs, title, sub) => { const b = H('button', 'btn ghost', '🖨️ ' + L('Print this quiz', 'اطبعي الكويز ده')); b.onclick = () => MPRINT(qs, title, sub); return b; };

/* ---- router ---- */
const tabs = document.getElementById('tabs');
tabs.onclick = e => { const b = e.target.closest('button'); if (b) go(b.dataset.v); };
document.getElementById('home-t').onclick = () => go('home');
let cur = { v: 'home' };
function go(v, a, b, keepScroll) {
  try { speechSynthesis.cancel(); } catch(e) {}
  const y = window.scrollY;
  cur = { v, a, b };
  [...tabs.children].forEach(t => t.classList.toggle('on', t.dataset.v === v));
  app.innerHTML = ''; window.scrollTo(0, keepScroll ? y : 0);
  (V[v] || V.home)(a, b);
  if (keepScroll) window.scrollTo(0, y);
}
const back = (label, fn) => { const b = H('button', 'back', '← ' + label); b.onclick = fn; app.appendChild(b); };
const V = {};

V.home = () => {
  const hero = H('div', 'hero');
  const n = E.starCount();
  hero.innerHTML = `<img class="heroimg" src="img/mishmish.webp" alt="Chef Mishmish"><div><b class="big">Hi, Chef Amina! 👩‍🍳</b><p>You have <b>${n}</b> star${n === 1 ? '' : 's'} ⭐ ${n ? '— keep going, I’m proud of you!' : '— let’s get the first star!'}</p><p style="font-size:15px;opacity:.95">What are we cooking today? 🍳</p></div>`;
  app.appendChild(hero);
  const t = H('div', 'tiles');
  [['learn', '📚', 'Learn', 'A story, a picture & a trick'], ['times', '✖️', 'Times tables', 'Japanese method + tricks'], ['quiz', '📝', 'Weekly quizzes', '13 weeks × 3 models'], ['month', '🏆', 'Monthly exams', 'Month 1 and Month 2']].forEach(([v, e, a, s]) => {
    const b = H('button', 'tile', `<b>${e}</b><span>${a}</span><small>${s}</small>`); b.onclick = () => go(v); t.appendChild(b);
  });
  app.appendChild(t);
  const sec = H('div', 'section');
  sec.appendChild(H('h3', '', '🧭 How do I study here?'));
  sec.appendChild(biBlock(
    `<ol><li>Open the lesson from <b>📚 Learn</b>, read the story and look at the picture.</li><li>Try the trick ⚡ and solve one ✋ question.</li><li>Go to the <b>📝 quiz</b> for the same week and solve Model A.</li><li>If you make a mistake, tap 👣 and look at the steps, then try again.</li><li>Want to practise writing? 🖨️ print the quiz and solve it on paper, then check with Mum.</li><li>At the end of the month, try the <b>🏆 monthly exam</b>.</li></ol>`,
    `<ol><li>افتحي الدرس من <b>📚 Learn</b> واقري الحكاية وشوفي الصورة.</li><li>جربي الحيلة ⚡ وحلّي سؤال ✋ واحد بس.</li><li>روحي <b>📝 الكويز</b> بتاع نفس الأسبوع وحلّي Model A.</li><li>لو غلطتي اضغطي 👣 وشوفي الخطوات وجربي تاني.</li><li>عايزة تتمرني على الكتابة؟ 🖨️ اطبعي الكويز وحلّيه على الورق وصححيه مع ماما.</li><li>آخر الشهر جربي <b>🏆 امتحان الشهر</b>.</li></ol>`));
  app.appendChild(sec);
};

V.learn = () => {
  app.appendChild(H('h2', '', '📚 Learn — choose a unit'));
  const g = H('div', 'units');
  UNITS.forEach((u, i) => {
    const got = E.starCount('l:' + u.id + ':');
    const b = H('button', 'unit', `<img class="ucover" src="img/u${i + 1}.webp" alt="" loading="lazy"><em>${got}/${u.lessons.length} ⭐</em><span>${u.emoji} ${u.en}</span><small>Unit ${i + 1} · <span dir="rtl" style="padding:0">${u.t}</span></small>`);
    b.style.background = `linear-gradient(135deg, ${u.color}, color-mix(in srgb, ${u.color} 70%, #000))`;
    b.onclick = () => go('unit', u.id); g.appendChild(b);
  });
  app.appendChild(g);
};

const WAYS = [['story', '🍳 Story'], ['pic', '🎨 Picture'], ['steps', '🪜 Steps'], ['trick', '⚡ Trick'], ['try', '✋ Try it']];
V.unit = (id) => {
  const u = UNITS.find(x => x.id === id), ui = UNITS.indexOf(u);
  back('All units', () => go('learn'));
  app.appendChild(H('div', 'ubanner', `<img src="img/u${ui + 1}.webp" alt="">`));
  app.appendChild(H('h2', '', `${u.emoji} Unit ${ui + 1}: ${u.en} <small class="flag" dir="rtl">${u.t}</small>`));
  u.lessons.forEach((l, li) => {
    const en = l.E || {};
    const c = H('div', 'lesson');
    const hd = H('div', 'lhead', `<h3>${li + 1}. ${l.en}</h3><small dir="rtl">${l.t}</small>`); hd.style.background = u.color;
    const ways = H('div', 'ways'), body = H('div', 'wbody');
    const show = (k) => {
      [...ways.children].forEach(b => b.classList.toggle('on', b.dataset.k === k)); body.innerHTML = '';
      const ol = a => '<ol>' + a.map(s => `<li>${s}</li>`).join('') + '</ol>';
      let blk = null;
      if (k === 'story') blk = biBlock(en.story, l.story);
      if (k === 'pic') blk = biBlock(en.pic || l.pic, l.pic);
      if (k === 'steps') blk = biBlock(en.steps ? ol(en.steps) : null, ol(l.steps));
      if (k === 'trick') blk = biBlock(en.trick, l.trick, 'trick');
      if (blk) body.appendChild(blk);
      if (k === 'try') { body.appendChild(E.tx('A little question from me (not from the book) to check you understood:', 'سؤال صغير مني (مش من الكتاب) علشان تتأكدي إنك فهمتي:', 'mini')); body.appendChild(E.card(l.try, 'l:' + u.id + ':' + li, '✋')); }
      if (k !== 'try') { const sp = H('button', 'btn ghost sm', '🔊 Listen'); sp.style.marginTop = '8px'; sp.onclick = () => { const t = body.firstChild.firstChild; E.speak(t.textContent, t.dir === 'rtl' ? 'ar-EG' : 'en-US'); }; body.appendChild(sp); }
    };
    WAYS.forEach(([k, lab]) => { const b = H('button', '', lab); b.dataset.k = k; b.onclick = () => { show(k); E.pop(); }; ways.appendChild(b); });
    c.append(hd, ways, body); app.appendChild(c); show('story');
  });
  const qs = WEEKS.filter(w => w.unit.id === id);
  if (qs.length) {
    const s = H('div', 'section', '<h3>📝 Quizzes for this unit</h3>');
    s.appendChild(uexamBtn(id));
    qs.forEach(w => { const b = H('button', 'btn ghost', `<span style="display:block">${w.title.replace('Weekly Assessment: ', '')}</span><small>Book page ${w.page}</small>`); b.style.margin = '4px'; b.onclick = () => go('week', w.id); s.appendChild(b); });
    app.appendChild(s);
  }
};

V.times = () => {
  app.appendChild(H('h2', '', '✖️ Times tables made easy'));
  const mk = (title, en, ar, fn) => { const s = H('div', 'section'); s.appendChild(H('h3', '', title)); if (en) s.appendChild(E.tx(en, ar, 'mini')); fn(s); app.appendChild(s); };
  app.appendChild(H('div', 'ubanner wide', '<img src="img/japan.webp" alt="Mishmish explains the Japanese method">'));
  mk('🎌 The Japanese method (lines and dots)', 'The first number is slanted lines 🔴, the second is lines slanted the other way 🔵. Count the crossing dots in each column — that’s the answer! Nothing to memorise.', 'الرقم الأول خطوط مايلة 🔴، والتاني خطوط مايلة على الناحية التانية 🔵. نعدّ نقط التقاطع في كل عمود، وده الناتج! مش محتاجة تحفظي حاجة.', TIMES.japanese);
  mk('🖐️ The 9 times table on your fingers', 'Spread your ten fingers. For 9 × a number: fold the finger with that number.', 'افردي إيديكي العشرة. علشان 9 × رقم: اثني الصباع اللي رقمه نفس الرقم.', TIMES.fingers);
  mk('⚡ Quick tricks', '', '', s => {
    const tricks = [
      ['×2', 'Double the number: 2 × 7 = 7 + 7 = 14 👯', 'ضعف الرقم: 2 × 7 = 7 + 7 = 14 👯'],
      ['×4', 'Double, then double again: 4 × 6 → 6 + 6 = 12 → 12 + 12 = 24', 'ضعف الضعف: 4 × 6 ← 6 + 6 = 12 ← 12 + 12 = 24'],
      ['×5', 'Multiply by 10 and take half: 5 × 8 → 80 → half is 40 ✂️ (and ×5 answers always end in 0 or 5)', 'اضربي في 10 وخدي النص: 5 × 8 ← 80 ← نصها 40 ✂️ (وناتج ×5 آخره دايماً 0 أو 5)'],
      ['×10', 'Put a zero on the right: 10 × 7 = 70 🚌', 'حطي صفر على اليمين: 10 × 7 = 70 🚌'],
      ['×3', 'Double + once more: 3 × 7 = 14 + 7 = 21', 'ضعف + كمان مرة: 3 × 7 = 14 + 7 = 21'],
      ['×6', 'For an even number, the answer ends in the same number with half of it in front: 6 × 4 = 24 , 6 × 8 = 48 ✨', 'لو الرقم زوجي، الناتج آخره نفس الرقم وقدامه نصّه: 6 × 4 = 24 ، 6 × 8 = 48 ✨'],
      ['×9', 'Multiply ×10 and subtract the number: 9 × 7 = 70 − 7 = 63. And the digits always add up to 9 (6 + 3 = 9) 🎯', 'اضربي ×10 واطرحي الرقم: 9 × 7 = 70 − 7 = 63. ومجموع أرقام الناتج دايماً 9 (6 + 3 = 9) 🎯'],
      ['×11', 'One digit: repeat it, 11 × 4 = 44. Two digits: 11 × 23 → 2 (2+3) 3 = 253 😲', 'لرقم من خانة واحدة: كرّريه 11 × 4 = 44. ولرقمين: 11 × 23 ← 2 (2+3) 3 = 253 😲'],
      ['56 = 7 × 8', 'Sing it: 5, 6, 7, 8 → 56 = 7 × 8 🎵', 'غنّيها: 5، 6، 7، 8 ← 56 = 7 × 8 🎵'],
      ['🔄', 'Order doesn’t matter: if you know 3 × 8, you know 8 × 3! Half the table is done for free', 'الأماكن مش بتفرق: لو عارفة 3 × 8 يبقى عارفة 8 × 3! نص الجدول بيروح لوحده']
    ];
    s.appendChild(biBlock('<div class="three">' + tricks.map(([a, b]) => `<div style="text-align:start"><b>${a}</b>${b}</div>`).join('') + '</div>',
      '<div class="three">' + tricks.map(([a, , c]) => `<div style="text-align:start"><b>${a}</b>${c}</div>`).join('') + '</div>'));
  });
  mk('🗺️ The table map', 'Each colour = a trick. Look: most of the table is easy now! Only the green ones need memorising (and there are very few).', 'كل لون = حيلة. شوفي: معظم الجدول بقى سهل! الأخضر بس هو اللي محتاج يتحفظ (وهو قليل خالص).', TIMES.map);
  mk('🚀 Rocket game', '', '', TIMES.game);
};

/* ---------- 📝 Full unit exam: every weekly-assessment question of the unit (all models), no repeats ---------- */
const UNTH = ['', 'Choose the correct answer:', 'Answer the following:'];
function unitExam(id) {
  const seen = new Set(), all = [];
  WEEKS.filter(w => w.unit.id === id).forEach(w => Object.keys(w.models).forEach(k => w.models[k].forEach((q, i) => {
    const key = q.t + '|' + String(q.q || '').replace(/<[^>]+>/g, '').toLowerCase().replace(/[^a-z0-9\u0621-\u064A]+/g, ' ').trim() + '|' + (q.o || []).join('|');
    if (seen.has(key)) return; seen.add(key); all.push({ q, key: `w:${w.id}:${k}:${i}` });
  })));
  const grp = x => (x.q.t === 'mcq' || x.q.t === 'pick') ? 1 : 2;
  const out = all.map((x, n) => [grp(x), n, x]).sort((a, b) => a[0] - b[0] || a[1] - b[1]).map(z => z[2]);
  let last = 0;
  return out.map(x => { const g = grp(x), pq = g !== last ? Object.assign({}, x.q, { sec: UNTH[g] }) : Object.assign({}, x.q, { sec: undefined }); last = g; return { q: x.q, pq, key: x.key }; });
}
const uexamBtn = id => { const u = UNITS.find(x => x.id === id), n = UNITS.indexOf(u) + 1, ex = unitExam(id);
  const b = H('button', 'item uexam', `<b>📝</b><div><span style="display:block">Unit ${n} — Full exam</span><small>${u.en} · ${ex.length} questions · 🖨️</small></div>`); b.onclick = () => go('uexam', id); return b; };
V.uexam = (id) => {
  const u = UNITS.find(x => x.id === id), n = UNITS.indexOf(u) + 1, ex = unitExam(id);
  back('All quizzes', () => go('quiz'));
  app.appendChild(H('h2', '', `📝 Unit ${n} — Full exam`));
  app.appendChild(E.tx(`${u.en} · ${ex.length} questions — every weekly-assessment question of the unit (Models A, B, C), no repeats.`, `${ex.length} سؤال — كل أسئلة التقييمات الأسبوعية للوحدة (النماذج A و B و C) من غير تكرار.`, 'mini'));
  const pr = H('div', 'printb'), p = H('button', 'btn', '🖨️ ' + L('Print the unit exam', 'اطبعي امتحان الوحدة'));
  p.onclick = () => MPRINT(ex.map(x => x.pq), `Unit ${n} — Full exam`, `Amina’s Math Kitchen · Grade 4 · Term 1 · Unit ${n}: ${u.en}`); pr.appendChild(p); app.appendChild(pr);
  const box = H('div'); app.appendChild(box);
  let last = null; ex.forEach((x, k) => { if (x.pq.sec && x.pq.sec !== last) { box.appendChild(H('h3', 'usec', x.pq.sec)); last = x.pq.sec; } box.appendChild(E.card(x.q, x.key, k + 1)); });
};
V.quiz = () => {
  app.appendChild(H('h2', '', '📝 Weekly quizzes'));
  { const ux = H('div', 'section', '<h3>📝 Full unit exams (solve or print)</h3>'); const uxl = H('div', 'list'); UNITS.forEach(u => { if (WEEKS.some(w => w.unit.id === u.id)) uxl.appendChild(uexamBtn(u.id)); }); ux.appendChild(uxl); app.appendChild(ux); }
  app.appendChild(E.tx('Each quiz has 3 models, exactly like the book: Model A, Model B and Model C. Start with Model A 🌟', 'كل كويز فيه 3 نماذج زي الكتاب بالظبط: Model A و Model B و Model C. ابدأي بـ Model A 🌟', 'mini'));
  const L2 = H('div', 'list');
  WEEKS.forEach((w, i) => {
    const tq = totalQ(w), got = wStars(w);
    const b = H('button', 'item', `<b>${w.unit.emoji}</b><div><span style="display:block">Week ${i + 1}: ${w.title.replace('Weekly Assessment: ', '')}</span><small>Unit ${UNITS.indexOf(w.unit) + 1} — book page ${w.page}</small><div class="prog"><i style="width:${got / tq * 100}%"></i></div></div><span class="pill">${got}/${tq} ⭐</span>`);
    b.onclick = () => go('week', w.id); L2.appendChild(b);
  });
  app.appendChild(L2);
};

function runList(qs, keyBase, container) {
  qs.forEach((q, i) => container.appendChild(E.card(q, keyBase + i, i + 1)));
}
V.week = (id, model) => {
  const w = WEEKS.find(x => x.id === id); model = model || 'A';
  const wi = WEEKS.indexOf(w);
  back('All quizzes', () => go('quiz'));
  const title = w.title.replace('Weekly Assessment: ', '');
  app.appendChild(H('h2', '', `${w.unit.emoji} ${title}`));
  app.appendChild(H('div', 'mini', `Weekly Assessment — book page ${w.page}`));
  const m = H('div', 'models');
  Object.keys(w.models).forEach(k => { const got = E.starCount(`w:${w.id}:${k}:`); const b = H('button', k === model ? 'on' : '', `Model ${k} <small>${got}/${w.models[k].length}⭐</small>`); b.onclick = () => go('week', id, k); m.appendChild(b); });
  app.appendChild(m);
  const pr = H('div', 'printb'); pr.appendChild(printBtn(w.models[model], `Week ${wi + 1}: ${title} — Model ${model}`, `Amina’s Math Kitchen · Grade 4 · Term 1 · book page ${w.page}`));
  const all = H('button', 'btn ghost', '🖨️ ' + L('Print all 3 models', 'اطبعي النماذج التلاتة'));
  all.onclick = () => MPRINT(Object.keys(w.models).flatMap(k => w.models[k].map((q, i) => i ? q : Object.assign({ sec: 'Model ' + k }, q))), `Week ${wi + 1}: ${title} — Models ${Object.keys(w.models).join(', ')}`, `Amina’s Math Kitchen · book page ${w.page}`);
  pr.appendChild(all); app.appendChild(pr);
  const box = H('div'); app.appendChild(box);
  runList(w.models[model], `w:${w.id}:${model}:`, box);
  const ks = Object.keys(w.models), nx = ks[ks.indexOf(model) + 1];
  const end = H('div', 'section', `<h3>🎉 Finished Model ${model}?</h3>`);
  if (nx) { const b = H('button', 'btn', `Model ${nx} →`); b.onclick = () => go('week', id, nx); end.appendChild(b); }
  else if (WEEKS[wi + 1]) { const b = H('button', 'btn', 'Next week →'); b.onclick = () => go('week', WEEKS[wi + 1].id); end.appendChild(b); }
  app.appendChild(end);
};

V.month = (id) => {
  if (id) {
    const mo = MONTH.find(x => x.id === id);
    back('Monthly exams', () => go('month'));
    app.appendChild(H('h2', '', '🏆 ' + mo.title));
    app.appendChild(E.tx(`Book pages ${mo.page} — take your time, you don’t have to finish it all at once 🌸`, `صفحة ${mo.page} في الكتاب — خدي وقتك، مش لازم تخلّصيه مرة واحدة 🌸`, 'mini'));
    const pr = H('div', 'printb'); pr.appendChild(printBtn(mo.qs, mo.title, `Amina’s Math Kitchen · Grade 4 · Term 1 · book pages ${mo.page}`)); app.appendChild(pr);
    const box = H('div'); app.appendChild(box); runList(mo.qs, `m:${mo.id}:`, box);
    return;
  }
  app.appendChild(H('h2', '', '🏆 Monthly exams'));
  const L2 = H('div', 'list');
  MONTH.forEach(mo => {
    const got = mStars(mo);
    const b = H('button', 'item', `<b>🏆</b><div><span>${mo.title}</span><small>Book pages ${mo.page} — ${mo.qs.length} questions</small><div class="prog"><i style="width:${got / mo.qs.length * 100}%"></i></div></div><span class="pill">${got}/${mo.qs.length} ⭐</span>`);
    b.onclick = () => go('month', mo.id); L2.appendChild(b);
  });
  app.appendChild(L2);
  app.appendChild(E.tx('💡 Tip: do the monthly exam after you finish the weekly quizzes before it.', '💡 نصيحة: حلّي امتحان الشهر بعد ما تخلّصي كويزات الأسابيع اللي قبله.', 'say'));
};

go('home');
})();
</script>
