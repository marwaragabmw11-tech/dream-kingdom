<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>مملكة العلوم · Science Kingdom · Grade 4</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#2d2438;--soft:#7a6f86;--line:#f0e2c8;--pri:#7b5cd6;--pri-l:#efe8ff;--gold:#f3b93a;--gold-l:#fff3d6;--ok:#2fa36b;--ok-l:#e3f6ec;--no:#e58a2b;--no-l:#fdeedd;--sky:#4aa8e0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Roboto,sans-serif;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:20;background:rgba(255,248,236,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px}
header .ttl{flex:1;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{border:2px solid var(--line);background:var(--card);border-radius:12px;min-width:40px;height:40px;padding:0 8px;font-weight:800}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:999px;padding:3px 9px;font-weight:800;font-size:14px;background:var(--gold-l);border:2px solid #f6dc9c;white-space:nowrap}
.chip.gem{background:#e8f4ff;border-color:#bcdcf7}
main{max-width:560px;margin:auto;padding:12px}
h2{margin:4px 0 8px;font-size:22px}h3{margin:8px 0 6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px;margin:0 0 12px}
.hero{display:flex;gap:12px;align-items:center;background:linear-gradient(135deg,#efe8ff,#fff3d6);border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px}
.hero .av{font-size:58px;line-height:1}
.hero p{margin:2px 0 6px;color:var(--soft);font-size:15px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills span{background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;font-weight:800;border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{border:2px solid var(--line);border-radius:20px;padding:14px 12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:118px}
.tile .big{font-size:36px;line-height:1.1}.tile b{font-size:17px}.tile small{color:var(--soft);font-size:13px;line-height:1.35}
.tile.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:12px;min-height:auto}
.land{display:flex;align-items:center;gap:12px;width:100%;border:2px solid var(--line);border-radius:22px;padding:12px;margin:0 0 10px;text-align:start;background:var(--card)}
.land .em{font-size:44px;width:64px;height:64px;border-radius:18px;display:grid;place-items:center;flex:none}
.land .tx{flex:1;min-width:0}.land b{display:block;font-size:18px}.land small{color:var(--soft);font-size:13px;display:block}
.boss{background:linear-gradient(135deg,#3b2a63,#6b4fb8);color:#fff;border-color:#5a43a0}.boss small{color:#e2d8ff}
.bar{height:10px;background:#f1ead9;border-radius:9px;overflow:hidden;margin-top:6px}.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ok),#7ad3a3);border-radius:9px}
.boss .bar{background:rgba(255,255,255,.25)}
.path{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.node{display:flex;align-items:center;gap:12px;border:2px solid var(--line);background:var(--card);border-radius:18px;padding:10px 12px;text-align:start;width:86%}
.node:nth-child(even){margin-inline-start:14%}
.node .n{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:20px;color:#fff;flex:none}
.node b{display:block}.node small{color:var(--soft);font-size:12.5px}
.node.lock{opacity:.5}
.stars{letter-spacing:1px;font-size:15px;color:#e0a81e}
.top{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.top .grow{flex:1}
.qc{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:14px}
.qtag{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}.qtag i{font-style:normal;font-size:12px;background:var(--pri-l);color:#5b3f99;border-radius:999px;padding:2px 9px;font-weight:700}
.qt{font-size:19px;font-weight:700;margin:6px 0 10px;line-height:1.5}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fffdf8;border-radius:16px;padding:11px 13px;margin:8px 0;font-size:16.5px;line-height:1.45;transition:transform .1s}
.opt:active{transform:scale(.98)}
.opt.g{background:var(--ok-l);border-color:var(--ok);font-weight:700}.opt.r{background:var(--no-l);border-color:var(--no)}
.opt.dim{opacity:.55}
.fb{border-radius:16px;padding:12px;margin-top:10px;font-size:16px}
.fb.ok{background:var(--ok-l)}.fb.no{background:var(--no-l)}
.fb p{margin:6px 0}
.w{border-bottom:1.5px dotted #a58be6;cursor:pointer}
.btn{border:0;border-radius:16px;padding:12px 18px;font-weight:800;background:var(--pri);color:#fff;font-size:17px}
.btn.alt{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.gold{background:var(--gold);color:#3a2a00}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.mini{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:6px 10px;font-size:14px;font-weight:700}
.ill svg{width:100%;height:auto;border-radius:12px;display:block;margin:4px 0}.ill small{color:var(--soft);font-size:11.5px}
.hearts{font-size:20px;letter-spacing:2px}
.bossbox{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#3b2a63,#6b4fb8);color:#fff;border-radius:18px;padding:10px 12px;margin-bottom:10px}
.bossbox .be{font-size:46px}.bossbox.hit .be{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
.timer{font-weight:900;font-size:20px;background:var(--no-l);border-radius:12px;padding:2px 10px}
.res{text-align:center}.res .big{font-size:70px;line-height:1.1}.res .stars{font-size:40px}
.kmap{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:linear-gradient(180deg,#bfe8c8,#9fd8ad);border-radius:22px;padding:10px;border:2px solid #8cc99b}
.plot{background:rgba(255,255,255,.72);border:2px dashed rgba(60,120,70,.35);border-radius:16px;padding:8px 4px;text-align:center;min-height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plot.on{border-style:solid;border-color:rgba(60,120,70,.5);background:rgba(255,255,255,.9)}
.plot.can{box-shadow:0 0 0 3px var(--gold);animation:glow 1.6s infinite}
@keyframes glow{50%{box-shadow:0 0 0 5px rgba(243,185,58,.4)}}
.plot .pe{font-size:34px;line-height:1.2}.plot b{font-size:12px;line-height:1.25}.plot small{font-size:11px;color:#3c6b46}
.decos{grid-column:1/-1;background:rgba(255,255,255,.55);border-radius:14px;padding:6px;font-size:26px;text-align:center;min-height:44px;letter-spacing:4px}
.sheet{position:fixed;inset:0;background:rgba(30,20,50,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto}
.req{list-style:none;padding:0;margin:8px 0}.req li{padding:4px 0}
.tabs{display:flex;gap:6px;margin-bottom:10px}.tabs button{flex:1;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px;font-weight:800}.tabs .on{background:var(--pri);color:#fff;border-color:var(--pri)}
.shop{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 4px;text-align:center}
.item .ie{font-size:36px}.item b{display:block;font-size:13px}.item.own{background:var(--ok-l)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bdg{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.bdg .ie{font-size:36px}.bdg b{display:block;font-size:12.5px;line-height:1.3}.bdg.off{opacity:.35;filter:grayscale(1)}
.slots{display:flex;gap:4px;justify-content:center;flex-wrap:nowrap;margin:12px 0;direction:ltr}
.slot{width:clamp(20px,7.4vw,34px);height:42px;border-bottom:3px solid var(--pri);font-size:24px;font-weight:900;display:grid;place-items:center;text-transform:lowercase}
.tiles{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;direction:ltr}
.tilel{width:44px;height:48px;border-radius:12px;border:2px solid var(--line);background:#fffdf8;font-size:22px;font-weight:900}
.tilel.used{visibility:hidden}
.memg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mc{height:84px;border-radius:16px;border:2px solid var(--line);background:linear-gradient(135deg,#7b5cd6,#a58be6);color:#fff;font-weight:800;font-size:15px;padding:4px;line-height:1.3}
.mc.open{background:#fff;color:var(--ink)}.mc.done{background:var(--ok-l);color:var(--ink);border-color:var(--ok)}
.mc .ar{font-size:15px}
#pop{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:3px solid var(--pri);padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));z-index:45;display:none;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-width:560px;margin:auto;border-radius:22px 22px 0 0}
#pop h3{margin:0 0 4px;direction:ltr;text-align:left}#pop .arw{font-size:24px;direction:rtl;text-align:right;color:var(--pri);font-weight:800}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(160px);background:var(--ink);color:#fff;border-radius:999px;padding:10px 18px;font-weight:800;transition:transform .3s;z-index:60;max-width:92vw;text-align:center;line-height:1.4}
.toast.show{transform:translateX(-50%) translateY(0)}
.cf{position:fixed;top:-40px;z-index:70;font-size:26px;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.pop{animation:pop .35s}@keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.note{font-size:13.5px;color:var(--soft)}
.avs{display:flex;flex-wrap:wrap;gap:6px}.avs button{font-size:30px;border:2px solid var(--line);background:var(--card);border-radius:14px;width:54px;height:54px}.avs .on{border-color:var(--pri);background:var(--pri-l)}
input[type=text]{font:inherit;width:100%;border:2px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff}
.lb{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:8px 0}.lb .ie{font-size:34px}.lb .grow{flex:1}
.ltr{direction:ltr;text-align:left}
.wk{border-top:1px solid var(--line);padding:8px 0;font-size:15px}

@media(max-width:430px){header .tn{display:none}header .ttl{flex:1}}
.pr{display:flex;justify-content:space-between;gap:8px}
.paper{background:#fff7e0;border:2px dashed #e9c46a;border-radius:16px;padding:10px 12px;margin-top:10px;font-size:16px}
.paper .big-a{font-size:17px;font-weight:700;margin:4px 0 8px}
.kwc{border:2px solid #e9c46a;background:#fff;border-radius:999px;padding:4px 10px;font-weight:700;font-size:14px}.kwc.on{background:var(--ok-l);border-color:var(--ok)}.kwc.on::before{content:'✔ '}
.mini.on{background:var(--pri);color:#fff;border-color:var(--pri)}
a.mini{display:inline-block;color:inherit}
</style></head><body>
<header></header>
<main></main>
<div id="pop"></div>
<script src="bank.js"></script>
<script src="../shared/print.js"></script>
<script src="sprint.js"></script>
<script>
/* ===== Game ===== */
/* =====================================================================
   مملكة العلوم · Science Kingdom — Grade 4 · Term 1
   Game engine. Uses the question bank above (C, Q, T, D, SV, IM).
   ===================================================================== */
for(let i=0;i<Q.length;i++){if(!Q[i][8]&&IM[i])Q[i][8]=IM[i];}
const $=s=>document.querySelector(s);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const W=t=>E(t).replace(/&[a-z#0-9]+;|[A-Za-z]+/g,m=>m[0]=='&'?m:'<span class="w">'+m+'</span>');
const shuf=a=>a.map(x=>[Math.random(),x]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,'');
const STOPW='that this with from have they their them when what which will your into than then there these those very much more most also only does both each make makes made does were been being about after before because over under such like just some many'.split(' ');
const kw=a=>[...new Set((String(a).match(/[A-Za-z]+/g)||[]).filter(w=>w.length>=4&&!STOPW.includes(w.toLowerCase())))].slice(0,6);
const lk=w=>{w=w.toLowerCase();for(const x of [w,w.replace(/ies$/,"y"),w.replace(/es$/,""),w.replace(/s$/,""),w.replace(/ed$/,""),w.replace(/d$/,""),w.replace(/ing$/,""),w.replace(/ing$/,"e"),w.replace(/ly$/,"")])if(D[x])return D[x]};

/* ------------------------- state ------------------------- */
const KEY='scienceKingdom_v1'+(()=>{try{return window.top!==window&&window.top.__fakeDB?':'+window.name:''}catch(e){return ''}})();
let G={players:[],cur:-1,lang:'ar',sound:true,pin:''};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&Array.isArray(s.players))G=Object.assign(G,s)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(G))}catch(e){}};
const NEWP=()=>({name:'',av:'🧒',avs:[],gold:60,gems:1,ok:{},bad:{},st:{},boss:{},b:{},decos:[],badges:{},streak:0,last:'',best:0,spelled:{},mem:0,fixed:0,answers:0,written:0,paper:false});
G.players=G.players.map(p=>Object.assign(NEWP(),p));
if(G.cur>=G.players.length)G.cur=G.players.length?0:-1;
const P=()=>G.players[G.cur];
const tr=(en,ar)=>G.lang=='ar'?ar:en;

/* ------------------------- world ------------------------- */
const LANDS=[
 {e:'🌳',en:'Nature Valley',ar:'وادي الطبيعة',col:'#3fa66b',bg:'#e3f6ec'},
 {e:'🦋',en:'Butterfly Garden',ar:'حديقة الفراشات',col:'#e2762f',bg:'#fdeedd'},
 {e:'🌱',en:'Green Farm',ar:'المزرعة الخضراء',col:'#5aa832',bg:'#ecf7e1'},
 {e:'💡',en:'Light Tower',ar:'برج الضوء',col:'#e0a81e',bg:'#fff3d6'},
 {e:'🔊',en:'Sound Canyon',ar:'وادي الأصوات',col:'#4aa8e0',bg:'#e5f3fc'},
 {e:'⛵',en:'Wind Harbor',ar:'ميناء الرياح',col:'#3b7fc4',bg:'#e3eefa'},
 {e:'🪀',en:'Rubber Workshop',ar:'ورشة المطاط',col:'#d6457a',bg:'#fde6ef'},
 {e:'🏺',en:'Soil Oasis',ar:'واحة التربة',col:'#a0683a',bg:'#f6ece2'}];
const BOSSES=[
 {m:1,e:'🐉',en:'The Sleepy Dragon',ar:'التنين النعسان',chs:'1–3'},
 {m:2,e:'👾',en:'The Shadow Monster',ar:'وحش الظلال',chs:'4–5'},
 {m:3,e:'🌪️',en:'The Storm Giant',ar:'عملاق العاصفة',chs:'6–8'}];
const ROUTE=[['l',0],['l',1],['l',2],['b',0],['l',3],['l',4],['b',1],['l',5],['l',6],['l',7],['b',2]];
const STAGES=[];
C.forEach((_,c)=>{
 const base=[],groups={},order=[];
 Q.forEach((q,i)=>{if(q[0]!=c||q[9])return;if(!q[7]){base.push(i);return}if(!groups[q[7]]){groups[q[7]]=[];order.push(q[7])}groups[q[7]].push(i)});
 const st=order.map(k=>({ch:c,label:k,ids:groups[k]}));
 if(base.length>=3)st.unshift({ch:c,label:'Starter',ids:base});else if(st.length)st[0].ids=base.concat(st[0].ids);
 st.forEach((s,k)=>{s.id='c'+c+'s'+k;s.n=k;STAGES.push(s)});
});
const stagesOf=c=>STAGES.filter(s=>s.ch==c);
const chQ=c=>Q.map((_,i)=>i).filter(i=>Q[i][0]==c);
const monthQ=m=>Q.map((_,i)=>i).filter(i=>Q[i][9]==m);
const nOk=p=>Object.keys(p.ok).length;
const mast=(p,c)=>{const ids=chQ(c);return Math.round(ids.filter(i=>p.ok[i]).length/ids.length*100)};
const starsTotal=p=>Object.values(p.st).reduce((a,b)=>a+b,0);
const landStars=(p,c)=>stagesOf(c).reduce((a,s)=>a+(p.st[s.id]||0),0);
const landDone=(p,c)=>stagesOf(c).every(s=>(p.st[s.id]||0)>0);

/* ------------------------- kingdom ------------------------- */
const BLD=[
 {id:'castle',e:['🛖','🏠','🏯','🏰','🏰👑'],en:'Royal Castle',ar:'القلعة الملكية',d:['The heart of your kingdom. Each level gives a bigger daily treasure and opens higher building levels.','قلب مملكتك. كل مستوى يزيد الكنز اليومي ويفتح مستويات أعلى للمباني.']},
 {id:'b0',ch:0,e:['🌱','🌿','🌳','🌳🦊','🌳🦊🦎'],en:'Nature Park',ar:'محمية الطبيعة',d:['Home of the fennec fox, the jerboa and the acacia tree.','بيت ثعلب الفنك والجربوع وشجرة السنط.']},
 {id:'b1',ch:1,e:['🥚','🐛','🐛🍃','🦋','🦋🌸🐝'],en:'Butterfly House',ar:'بيت الفراشات',d:['Watch the life cycle: egg, larva, pupa, adult.','شاهدي دورة الحياة: بيضة، يرقة، عذراء، حشرة كاملة.']},
 {id:'b2',ch:2,e:['🌱','🌿','🪴','🌻','🌻🌽🫘'],en:'Greenhouse',ar:'الصوبة الزراعية',d:['Seeds, roots, stems and leaves grow here.','هنا تنمو البذور والجذور والسيقان والأوراق.']},
 {id:'b3',ch:3,e:['🕯️','🔦','💡','🗼','🗼🌞'],en:'Light Tower',ar:'برج الضوء',d:['Light travels in straight lines from its top.','من قمته يسير الضوء في خطوط مستقيمة.']},
 {id:'b4',ch:4,e:['🥁','🪘','🎻','🎻🎺','🎼🏛️'],en:'Music Hall',ar:'قاعة الموسيقى',d:['Every sound here comes from vibration.','كل صوت هنا يأتي من الاهتزاز.']},
 {id:'b5',ch:5,e:['🪁','⛵','⛵⛵','🌬️⛵','🌬️⛵🏁'],en:'Wind Harbor',ar:'ميناء الرياح',d:['Big sails catch more wind.','الأشرعة الكبيرة تلتقط رياحًا أكثر.']},
 {id:'b6',ch:6,e:['🪀','🚗','🏎️','🏎️🏁','🏎️🏆'],en:'Toy Car Workshop',ar:'ورشة السيارات',d:['More stretch, more force, farther cars!','شدّ أكثر، قوة أكبر، مسافة أبعد!']},
 {id:'b7',ch:7,e:['🏺','🏺🌾','🌾🏺💧','🌴🌾🏺','🌴🌾🏺🗿'],en:'Pottery Village',ar:'قرية الفخار',d:['Clay pots, Nile silt and the old statue sledge.','أواني الطين، وطمي النيل، وزحّافة التماثيل القديمة.']},
 {id:'museum',e:['🏛️'],en:'Grand Science Museum',ar:'متحف العلوم الكبير',d:['The crown of the kingdom. Needs all 8 buildings and a level 3 castle.','تاج المملكة. يحتاج المباني الثمانية والقلعة في المستوى الثالث.']}];
const TH=[10,30,50,70,90],CASTLE_COST=[40,80,140,220,320],B_COST=[30,60,100,150,210];
const lvOf=(p,id)=>p.b[id]||0;
const maxLv=b=>b.e.length;
function req(p,b){const lv=lvOf(p,b.id)+1,n=[];let gold=0,gems=0;
 if(lv>maxLv(b))return null;

 if(q[1]=='Correct'){const wrong=q[3].replace(/^[^:]*:\s*/,'').replace(/^[a-z]\)\s*/,'').trim();if(wrong&&norm(wrong)!=norm(a))picks.push(wrong)}
 let pool=Q.map((_,j)=>j).filter(j=>Q[j][0]!=q[0]&&Q[j][4].length==1&&Q[j][1]==q[1]);
 if(pool.length<4)pool=Q.map((_,j)=>j).filter(j=>Q[j][0]!=q[0]&&Q[j][4].length==1);
 pool=shuf(pool).slice(0,12).sort((x,y)=>Math.abs(Q[x][4][0].length-a.length)-Math.abs(Q[y][4][0].length-a.length));

   - Mum's device is the referee (host): it picks the questions, keeps the

     (rooms/$code …), so no Firebase changes are needed.

async function connectFirebase(){
 const [A0,A,D]=await Promise.all([import(FSDK+'firebase-app.js'),import(FSDK+'firebase-auth.js'),import(FSDK+'firebase-database.js')]);
 const app=A0.initializeApp(FIREBASE_CONFIG,'science-kingdom');const auth=A.getAuth(app);
 if(auth.authStateReady)await auth.authStateReady();
 const user=auth.currentUser||(await A.signInAnonymously(auth)).user;const db=D.getDatabase(app);
 let off=0;D.onValue(D.ref(db,'.info/serverTimeOffset'),s=>{off=s.val()||0});const r=p=>D.ref(db,p);
 return{uid:user.uid,TS:D.serverTimestamp(),get:async p=>(await D.get(r(p))).val(),set:(p,v)=>D.set(r(p),v),update:(p,v)=>D.update(r(p),v),remove:p=>D.remove(r(p)),
  push:async(p,v)=>{const k=D.push(r(p));await D.set(k,v);return k.key},on:(p,cb)=>D.onValue(r(p),s=>cb(s.val()),e=>console.warn('listen',p,e&&e.message)),
  onAdd:(p,cb)=>D.onChildAdded(r(p),s=>cb(s.key,s.val())),now:()=>Date.now()+off,
  presence:p=>{const un=D.onValue(r('.info/connected'),s=>{if(s.val()===true){D.onDisconnect(r(p)).update({online:false}).catch(()=>{});D.update(r(p),{online:true}).catch(()=>{})}});return()=>{un();D.onDisconnect(r(p)).cancel().catch(()=>{})}}}}

const genCode=()=>Array.from({length:6},()=>CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]).join('');
function buildDeck(){const pool=shuf(OSET.m?monthQ(OSET.m):Q.map((_,i)=>i).filter(i=>OSET.chs.includes(Q[i][0])));
 const deck=pool.slice(0,Math.min(pool.length,OSET.per*OSET.rounds)).map(i=>({i,paper:false}));
 if(OSET.paper)for(let k=OSET.paper-1;k<deck.length;k+=OSET.paper){if(Q[deck[k].i][4].length==1){deck[k].paper=true;continue}
  const j=deck.findIndex((d,x)=>x>k&&Q[d.i][4].length==1);if(j>0){const t=deck[k];deck[k]=deck[j];deck[j]=t;deck[k].paper=true}}
 return deck}

 return h+'<div class="row">'+(m.status!='end'&&m.status!='lobby'?'<button class="btn alt" data-a="oend">🏁 '+tr('End game','إنهاء اللعبة')+'</button>':'')+'<button class="btn alt" data-a="oclose">🗑️ '+tr('Close room','إغلاق الغرفة')+'</button></div>'}
function playerV(){const m=O.meta;if(!m||O.role!='player')return onlineV();const u=api.uid,me=O.players[u]||{},st=normSt(O.stats[u]),k=normK(O.kings[u]),q=O.q,r=O.rev;
 let h='<div class="top"><span class="chip">'+E(me.av||'')+' '+E(me.name||'')+'</span><span class="chip">⭐ '+st.score+'</span><span class="chip">🪙 '+k.gold+'</span><span class="chip">✍️ '+st.written+'</span><span class="grow"></span><small class="note" dir="ltr">'+O.code+'</small></div>';
 if(m.status=='lobby')h+='<div class="card res"><div class="big">⏳</div><h3>'+tr('Waiting for the referee to start…','ننتظر الحَكَم ليبدأ…')+'</h3></div><div class="card">'+plist()+'</div>';
 else if(m.status=='question'&&q){const mine=O.my[q.qKey];h+='<div class="qc" dir="ltr"><div class="row" style="margin:0 0 6px"><span class="timer">⏱ <span id="otm">'+Math.max(0,Math.ceil((q.endsAt-api.now())/1000))+'</span></span></div>'+qBlock(q)+
  (q.paper?(mine?'<div class="paper">✔ Sent! When the time ends, compare your paper with the model answer.</div>':'<div class="paper">✍️ <b>Paper question!</b><br>Write your answer on paper. Then tap the button. The referee will check it!<div class="row"><button class="btn" data-a="owrote">I wrote it ✍️</button></div></div>'):
  (q.opts||[]).map((o,n)=>'<button class="opt'+(mine?(mine.c===n?' g':' dim'):'')+'" data-a="oans" data-i="'+n+'">'+E(o)+'</button>').join('')+(mine?'<p class="note">✔ Answer sent. Wait for the others…</p>':''))+'</div>'}
 else if(m.status=='reveal'&&r){const x=(r.res||{})[u];h+='<div class="qc" dir="ltr">'+(q?qBlock(q):'');
  if(r.paper){h+='<div class="paper"><b>📖 Model answer:</b><p class="big-a">'+W(r.ans)+'</p><b>🔎 Did you write these words correctly?</b><div class="row">'+kw(r.ans).map(w=>'<button class="kwc" data-a="kwc">'+E(w)+'</button>').join('')+'</div></div>'+(!x?'<p class="note">You did not send a paper answer this time.</p>':x.gr?'<div class="fb '+(x.gr=='again'?'no':'ok')+'"><b>👩‍⚖️ '+OGR[x.gr][0]+' +'+x.g+' 🪙</b></div>':'<div class="fb ok">👩‍⚖️ The referee is checking your paper… show it to her!</div>')}
  else{h+=(q&&q.opts||[]).map((o,n)=>'<div class="opt'+(n===r.c?' g':x&&x.c===n?' r':' dim')+'">'+E(o)+'</div>').join('')+'<div class="fb '+(x&&x.ok?'ok':'no')+'"><b>'+(x&&x.ok?'🌟 Correct! +'+x.g+' 🪙':x&&!x.none?'💪 Good try!':'⏰ No answer this time.')+'</b>'+(x&&x.ok?'':'<p><b>'+W(r.ans)+'</b></p>')+'<p>💡 '+W(r.why)+'</p><p>🌍 '+W(r.ex)+'</p>'+
   (x&&!x.ok?'<div class="paper">'+(O.forf[r.qKey]?'⚖️ ✔ Sent! Show your paper to the referee.':'⚖️ <b>Referee’s challenge:</b> write the correct answer on paper 2 times and show the referee. +10 🪙<div class="row"><button class="mini" data-a="oforf">I did it ✍️</button></div>')+'</div>':'')+'</div>'}
  h+='</div>'}
 else if(m.status=='build')h+='<div class="card"><h3>🏰 '+tr('Building time!','وقت البناء!')+'</h3><p class="note">'+tr('Spend your game gold on your online kingdom.','اصرفي ذهب اللعبة على مملكتك في هذه اللعبة.')+'</p></div><div class="kmap">'+BLD.map(b=>{const lv=k.b[b.id]||0,rq=oreq(k,b);return '<button class="plot'+(lv?' on':'')+(rq&&rq.can?' can':'')+'" data-a="oplot" data-i="'+b.id+'"><span class="pe">'+(lv?b.e[lv-1]:'🏗️')+'</span><b>'+tr(b.en,b.ar)+'</b><small>'+(lv?tr('Level ','المستوى ')+lv:'')+'</small></button>'}).join('')+'</div><p class="note">⏳ '+tr('The referee will start the next round.','الحَكَم سيبدأ الجولة التالية.')+'</p>';
 else if(m.status=='end')h+='<div class="card res"><div class="big pop">🏆</div><h2>'+tr('Game over!','انتهت اللعبة!')+'</h2>'+(P()?'<p>🏰 '+tr('Your score was added as gold to your kingdom at home.','أُضيفت نقاطك ذهبًا إلى مملكتك في البيت.')+'</p>':'')+'</div><div class="card">'+plist()+'</div>';
 else h+='<div class="card">⏳</div>';
 return h+'<div class="row"><button class="btn alt" data-a="oleave">🚪 '+tr('Leave','خروج')+'</button></div>'}
function oplotSheet(id){const k=normK(O.kings[api.uid]),b=BLD.find(x=>x.id==id),lv=k.b[id]||0,r=oreq(k,b);
 sheet('<h2>'+(lv?b.e[lv-1]:'🏗️')+' '+tr(b.en,b.ar)+'</h2><p>'+tr(b.d[0],b.d[1])+'</p>'+(r?'<ul class="req">'+r.need.map(x=>'<li>'+(x.ok?'✅':'⬜')+' '+x.t+'</li>').join('')+'</ul><div class="row"><button class="btn gold" data-a="obuild" data-i="'+id+'"'+(r.can?'':' disabled')+'>🔨 '+(lv?tr('Upgrade','طوّري'):tr('Build','ابني'))+'</button></div>':'<p>👑 '+tr('Max level!','أعلى مستوى!')+'</p>')+'<div class="row"><button class="btn alt" data-a="sheetx">'+tr('Close','إغلاق')+'</button></div>')}

/* ------------------------- online events ------------------------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,t=b.dataset.t;
 if(a=='och'){OSET.m=0;const c=+i;OSET.chs=OSET.chs.includes(c)?OSET.chs.filter(x=>x!=c):OSET.chs.concat(c).sort();remember()}
 else if(a=='om'){OSET.m=OSET.m==+i?0:+i;remember()}
 else if(a=='oset'){OSET[t]=+i;remember()}
 else if(a=='oav'){VA.oav=t;keep(()=>draw())}
 else if(a=='ocreate')hostCreate();else if(a=='oresume')hostResume();else if(a=='oreturn')rejoin();else if(a=='ojoin')joinRoom();
 else if(a=='onext')hostNext().catch(er=>toast('⚠️ '+(er.message||er)));else if(a=='oreveal')hostReveal();
 else if(a=='ograde')hostGrade(b.dataset.u,t).catch(er=>toast('⚠️ '+(er.message||er)));
 else if(a=='ofok')hostForfeit(t,true);else if(a=='ofno')hostForfeit(t,false);
 else if(a=='oend'){if(confirm(tr('End the game now?','إنهاء اللعبة الآن؟')))hostEnd()}else if(a=='oclose')hostClose();
 else if(a=='ocopy'){try{navigator.clipboard.writeText(t);toast(tr('Link copied ✅','تم نسخ الرابط ✅'))}catch(er){prompt('',t)}}
 else if(a=='oans')sendAns({c:+i});else if(a=='owrote')sendAns({n:1});
 else if(a=='oforf'){const r=O.rev;if(!r||O.forf[r.qKey])return;O.forf[r.qKey]=1;rd();api.push(RP('requests'),{uid:api.uid,t:'forfeit',q:r.qKey,i:r.i,at:api.TS}).catch(er=>{delete O.forf[r.qKey];rd();toast('⚠️ '+(er.message||er))})}
 else if(a=='oplot')oplotSheet(i);
 else if(a=='obuild'){closeSheet();api.push(RP('requests'),{uid:api.uid,t:'build',b:i,at:api.TS}).catch(er=>toast('⚠️ '+(er.message||er)));sfx.build()}
 else if(a=='oleave'){if(confirm(tr('Leave the game?','الخروج من اللعبة؟')))leaveRoom()}});
function keep(f){const c=($('#ocode')||{}).value,n=($('#oname')||{}).value;f();if($('#ocode')&&c!=null)$('#ocode').value=c;if($('#oname')&&n!=null)$('#oname').value=n}
function remember(){OLS.set('set',JSON.stringify(OSET));keep(()=>draw())}

/* ------------------------- start ------------------------- */
if(OQS.get('room')&&!OLS.get('host')){V='online'}
daily();draw();
</script></body></html>
