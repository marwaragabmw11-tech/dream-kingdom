const Q=[
[0,"Complete",0,"Complete: The place where the organism lives and finds its needs is called ______.",["habitat","adaptation","classification","burrow"],"A habitat gives an organism its food, water and shelter.","Your home gives you food, water and a bed. It is your habitat."],
[0,"Give Reason",1,"Give Reason: Some living organisms prefer to live near grass and trees?",["They find food and shelter there.","They like the colour green.","They cannot drink water.","They are afraid of people."],"Grass and trees give food (plants, insects) and a safe place to hide.","A bird builds a nest in a tree because the tree gives it a safe home."],
[0,"Choose",1,"Why do some animals hide in burrows during hot weather?",["To protect themselves from sun’s heat","To get food","To be exposed to direct sunlight","To get water"],"A burrow is under the ground, so it is cool and shaded.","On a hot day you rest inside, in the shade, not in the sun."],
[0,"Give Reason",2,"Give Reason: Fennec fox has large ears and fur on the soles of its feet.",["Ears lose body heat; fur protects its feet from hot sand.","Ears help it swim; fur keeps it dry.","Ears store water; fur helps it climb.","Ears catch food; fur makes it look big."],"These are adaptations. Big ears let heat leave the body. Fur works like shoes on hot sand.","A fan cools a room, and sandals protect your feet on hot sand."],
[0,"What Happens?",1,"What happens if: A living organism is in an environment that doesn’t suit its needs?",["It cannot get its needs, so it may not survive.","It grows bigger.","It becomes a non-living thing.","Nothing happens."],"Every organism needs food, water and shelter. Without them it may die.","A fish taken out of water cannot live."],
[1,"Choose",0,"Which of the following represents the correct order of the stages in a butterfly life cycle",["Egg → Larva → Pupa → Adult butterfly","Egg → Pupa → Larva → Adult butterfly","Larva → Egg → Pupa → Adult butterfly","Pupa → Larva → Egg → Adult butterfly"],"The egg hatches into a larva (caterpillar). The larva becomes a pupa. The pupa becomes an adult butterfly.","Think of a story: a tiny egg, a hungry caterpillar, a quiet cocoon, then a butterfly."],
[1,"Define",1,"Define Molting:",["The larva sheds its old tight skin and grows a new, bigger one.","Laying eggs on leaves.","Eating very little food.","Sleeping under the soil."],"The larva grows fast but its skin does not stretch. So it must shed the old skin.","You grow out of old clothes and need bigger ones."],
[1,"Compare",1,"Compare between: the Larva and pupa stages according to (Feeding- Next Stage):",["Feeding: the larva eats leaves a lot, the pupa does not eat. Next stage: the larva → pupa, the pupa → adult butterfly.","Feeding: both eat leaves. Next stage: the larva → egg, the pupa → larva.","Feeding: the larva does not eat, the pupa eats a lot. Next stage: the larva → adult, the pupa → pupa.","Feeding: neither one eats. Next stage: both become eggs."],"The larva stores energy by eating leaves. The pupa rests and lives on that stored food.","A camel stores food in its hump; the pupa uses food stored earlier."],
[1,"Short Answer",0,"Is a spider considered an insect? Prove your answer.",["No. It has 8 legs, no wings, no antennae and 2 body parts.","Yes. It has 6 legs and 4 wings.","Yes. It has 3 body parts and 2 antennae.","No. It has 6 legs and 2 antennae."],"An insect has 3 body parts, 6 legs, 2 antennae and usually wings. A spider has 8 legs.","Count the legs: a bee has 6, a spider has 8."],
[2,"Choose",1,"Choose the correct answer: The main function of the stem in the plant is :",["Supports the plant and acts as a passage for transporting water to the leaves.","Absorbs water and dissolved salts from the soil.","Captures the greatest possible amount of sunlight.","Anchors the plant firmly within the ground."],"The stem is like a pipe and a pole. It holds the plant up and carries water.","A straw carries your juice up to your mouth."],
[2,"Give Reason",1,"Give reason: Some plant leaves have a broad, flat shape.",["To capture the greatest amount of sunlight.","To drink more water.","To hold the plant in the soil.","To make fruit."],"Leaves use sunlight to make food. A wide, flat shape catches more light.","A big solar panel catches more sunlight than a small one."],
[2,"Complete",0,"Complete: The part that extends beneath the soil surface and absorbs water is ______.",["root","stem","leaf","flower"],"Roots grow down into the soil. They absorb water and anchor the plant.","Roots are like the plant’s straws and anchor."],
[3,"Choose",1,"Choose the correct answer: All of the following are true regarding how sunlight travels, EXCEPT:",["When sunlight bounces off a mirror, it starts moving in a curved line.","Sunlight always has the property of traveling in a straight line.","Sunlight continues to travel in straight lines after bouncing off a mirror.","The light path can be observed by sprinkling a small amount of starch."],"Light always travels in straight lines, even after reflection.","A torch beam in a dark room is a straight line."],
[3,"What Happens?",2,"What happens if: The spot of light collected by the magnifying glass becomes smaller?",["It gets hotter and burns the paper faster.","It gets colder.","Nothing changes.","The paper turns white."],"A smaller spot has the same light in a tiny place, so it is brighter and hotter.","A spray can be gentle, but a thin jet of water pushes harder."],
[3,"Give Reason",1,"Give scientific reason: shadows always formed in the direction opposite to Sun.",["Light travels in straight lines and is blocked by the object.","Shadows like the cold.","The Sun moves the shadow.","Light bends around objects."],"An opaque object blocks the light, so the dark area is behind it, on the opposite side.","Stand with the Sun in front of you: your shadow falls behind you."],
[3,"Choose",0,"When do we get the shortest shadow length during the day?",["At noon, when the Sun is highest","Early morning","Sunset","Midnight"],"When the Sun is high above, light comes from above and the shadow is short.","Your shadow is tiny when the Sun is right over your head."],
[4,"Complete",0,"Sounds are produced when objects move rapidly up and down or back and forth. This motion called (______).",["vibration","rotation","reflection","evaporation"],"Vibration is a fast back-and-forth movement. It makes sound.","Touch your throat while humming. You feel it vibrate."],
[4,"What Happens?",1,"What will happen in the following cases? Holding midpoint of string in the string phone.",["The string stops vibrating, so the sound stops.","The sound gets louder.","The sound is clearer.","Nothing changes."],"Sound travels along the string by vibrations. Holding it stops them.","Touch a ringing bell and the ringing stops."],
[5,"Compare",1,"Compare between: Small Sail Boat and Large Sail Boat (in terms of: air quantity that sail captured - distance that sailboat moved)",["Small sail: small amount of air, shorter distance. Large sail: large amount of air, longer distance.","Small sail: large amount of air, longer distance. Large sail: small amount of air, shorter distance.","Both sails capture the same amount of air and move the same distance.","Neither sail captures any air."],"A large sail has a big surface and catches more wind, so the force is greater.","A big kite is pulled harder by the wind than a small kite."],
[6,"What Happens?",1,"What happens when: Increasing rubber band stretch.",["The car is pushed a longer distance.","The car moves a shorter distance.","The rubber band breaks always.","The force becomes zero."],"A bigger stretch stores more force. When released, it pushes harder and farther.","Pull a slingshot back more and the stone flies farther."],

[7,"Give Reason",1,"Mention the scientific reason: Nile River silt is considered suitable and ideal for agriculture in the Egyptian environment.",["It keeps water and is rich in nutrients for plants.","It is very sandy.","It lets water drain at once.","It has no particles."],"Silt has very fine particles, so it holds water. It also carries food for plants.","Farmers along the Nile grow crops because the soil stays moist and rich."]

add(0,"Lessons 1-1/1-2",[[["Complete","Complete the following statement: When you preparing an Observation card, you write ______ first.",["the date"]],["Short Answer","Mention an example of a living organism that lives near flower beds.",["Bee (or butterfly)."]],["Correct","Correct the following statement: The pigeon seeks refuge in burrows or under rocks away from sunlight.",["The lizard (not the pigeon) seeks refuge in burrows or under rocks away from sunlight."]],["Short Answer","What are the characteristics that distinguish living organisms from non-living things?",["Living organisms feed, breathe and grow; they also move and reproduce. Non-living things don’t."]]],[["Complete","Complete the following statement: Animals and plants are examples of ______",["living organisms"]],["Give Reason","Give Reason: The types of living organisms you find vary depending on the location.",["Each place gives different conditions (food, water, heat), so it suits different living organisms."]],["Short Answer","Mention an example of a living organism that lives under rocks or in rocks shadows.",["Lizard, beetle or ants."]],["Correct","Correct the statement: You should write your favorite clothes colors, at the beginning of the observation record card,",["You should write the date, the organism’s name and its location at the beginning of the observation record card."]],["Short Answer","Mention three basic items you should be recorded on a observation record card when observing a living organism?",["Organism name, date, and location (also shape and colour)."]]],[["Complete","Complete the following statement: The place where the living organism lives is called ______.",["habitat"]],["Give Reason","Give Reason: some living organisms choose to live near grasses?",["They find food and shelter there, and it is cooler and damp."]],["Short Answer","Describe how to use a magnifying glass to examine a Willow leaf.",["Hold the lens near the leaf and move it until the leaf looks clear; observe its veins and edges."]],["Correct","Correct the following statement: When drawing the organism you observe on the observation recording card, you should use broad and thick lines.",["You should use thin, light and clear lines."]],["Short Answer","What do you think of the following action: Looking directly at Sun with a magnifying glass?",["Wrong and dangerous: it can seriously damage the eyes. Never look at the Sun, even with a magnifying glass."]]]]);
add(0,"Lessons 1-3/1-4",[[["Complete","Complete the following statement: The Nile River banks environment is characterized by ______ soil and abundant water.",["moist"]],["Give Reason","Give Reason: The roots of the Acacia tree grow very deep underground?",["To reach water deep underground in the dry desert."]],["Define","What is meant by classification?",["Putting living organisms into groups by their similar characteristics."]],["What Happens?","What happens if: A Jerboa is moved to live in a water-abundant environment such as the banks of the Nile?",["It can’t adapt to the new place and may not survive."]],["Compare","Compare between: The Desert environment and the Nile River banks environment in terms of water abundance:",["Desert: little water (dry). Nile banks: abundant water."]]],[["Complete","Complete the following statement: Fennec fox and Jerboa are animals that are adapted to live in a ______ environment.",["desert"]],["Give Reason","Give Reason: Animals and plants possess special characteristics and behaviors called adaptation?",["Because these characteristics and behaviors help them survive in their habitats."]],["Define","What is meant by adaptation?",["Changes in body parts or behavior that help an organism survive."]],["What Happens?","What happens if: you plant an orange tree in a dry, water-scarce desert environment?",["It won’t get enough water, so it wilts and dies."]],["Short Answer","Explain briefly: the steps for classification living organisms?",["Observe them, find similar characteristics, then put them in groups."]]],[["Complete","Complete the following statement: A plant that grows in abundant water and moist soil is called ______ plant.",["aquatic"]],["Give Reason","Give Reason: Frogs and water fowl cannot live in the dry desert?",["They need water and moist soil, and the desert is dry with little water."]],["Short Answer","What adaptations helped Acacia plant to live and survive in the desert environment?",["Deep long roots, small leaves and thorns."]],["Short Answer","Classify the following organisms in two different ways (Lotus - Acacia - Fennec fox - frog)",["Plant or animal: Lotus and Acacia are plants; Fennec fox and frog are animals. By habitat: Lotus lives in water, Acacia and Fennec fox live in the desert, frog lives near water."]],["Compare","Compare between: the Desert environment and the Nile River banks environment in terms of soil dryness:",["Desert: dry, sandy soil, little water. Nile banks: moist, muddy (clay) soil, plenty of water."]]]]);
add(0,"Lesson 1-5",[[["Choose","Choose the correct answer: from the physical characteristic that helps Jerboa to adapt in desert, the presence of ______",["Long hind legs.","Small ears.","Thick foot sole fur.","Water storage inside the body."]],["Short Answer","Mention an example of a smart way or behavior that desert animals use to avoid the intense heat of Sun during the day.",["Hiding in cool burrows by day (active at night)."]],["What Happens?","What happens if: the Fennec fox’s feet lack thick fur on the soles while walking on hot sand?",["Its feet would burn on the hot sand."]],["Compare","Compare between: The jerboa and the Fennec fox (in terms of: ear size):",["Jerboa: smaller ears than the Fennec fox. Fennec fox: very large ears that lose body heat."]]],[["Choose","Choose the correct answer: Desert animals hide during the day in cool underground burrows in order to:",["Escape extreme solar heat and retain body moisture.","Search for food and hunt.","Compete with other animals for shelter.","Practice very fast jumps."]],["Give Reason","Give Reason: The hind legs of a Jerboa are long.",["To jump far and fast to escape enemies."]],["Short Answer","Mention an example of an organism that can live in the desert, depending on the presence of water in its food",["Jerboa (or camel)."]],["What Happens?","What happens if: Living organisms in Egyptian deserts didn’t possess physical or behavioral characteristics suited to the harsh desert environment.",["They would not survive the heat and dryness."]],["Compare","Compare between: Jerboa and Fennec fox (in terms of: their legs’ characteristics)",["Jerboa: long strong hind legs, short front legs, for jumping. Fennec fox: thick fur on soles, protects from hot sand, for walking on sand."]]],[["Choose","Choose the correct answer: Jerboa rarely drinks water but it gets most of needs of water from ______",["its food like plants and seeds.","rain water which is collected inside burrows.","drinking large amount of water once and storing them inside the body.","daily migration to oasis and water resources."]],["Give Reason","Give Reason: The Jerboa moves in rapid, successive leaps over hot desert sand.",["To move fast on hot sand and escape enemies."]],["Short Answer","Mention an example of a structure that helps the Fennec fox cool its body and get rid of excess heat.",["Its very large ears."]],["What Happens?","What happens if: Desert animals searched for food during midday instead of at night?",["They would lose water and could die from the heat."]],["Compare","Compare between: the ears of the fox that live in the forests and the ears of the Fennec fox: ( in term of size )",["Forest fox: small ears (cold place, keeps heat). Fennec fox: very large ears (lose body heat in hot desert)."]]]]);
add(1,"Chapter 2 Assessment",[[["Choose","Choose the correct answer: Most insects usually lay their eggs on:",["The lower surface (back) of plant leaves.","Dead and dry tree trunks.","Very high mountain peaks.","Dry rocks in open deserts."]],["Give Reason","Explain: Newly hatched larvae eat large amounts of food rapidly.",["To get energy and grow quickly; it stores food for the pupa stage, when it doesn’t eat."]],["Complete","write the number representing: Number of legs on a bee ______ ; Number of body parts of a butterfly ______",["Legs on a bee: 6. Body parts of a butterfly: 3."]],["What Happens?","What happens if: The larva cannot undergo molting process to replace its skin during continuous growth?",["It can’t grow bigger (its tight skin stops it), so it may die."]],["Compare","Compare: The adult insect stage and pupa stages in terms of: movement ability and feeding",["Pupa: does not move, does not eat. Adult insect: moves and flies, feeds on nectar."]]],[["Choose","Choose the correct answer: A tiny insect that has just hatched from the egg is called the :",["Larva.","Adult or Complete insect.","Pupa .","Egg."]],["Complete","write the number representing: Number of wings on a bee ______ ; Number of antennae on a butterfly ______",["Wings on a bee: 4. Antennae on a butterfly: 2."]],["Short Answer","Give an example of: A safe place where insects seek refuge to protect their eggs.",["The lower surface (back) of plant leaves."]],["What Happens?","What happens if: An insect egg hatches in a dry environment and lacking food and plants suitable for their feeding?",["The larva can’t find food, so it may die."]],["Short Answer","Are all insect eggs similar (Yes / No)? Explain your answer.",["No. They differ in shape, colour and size by insect type."]]],[["Choose","Choose the correct answer: The process of molting in insects primarily means:",["Shedding its old skin and replacing it for a larger body","Laying eggs abundantly on leaves surfaces.","Searching for huge amounts of food to store.","Entering a long hibernation period under the soil."]],["Complete","write the number representing: Number of stages of bee life cycle ______ ; Number of eyes of butterfly ______",["Stages of bee life cycle: 4. Eyes of butterfly: 2."]],["Short Answer","Give an example of: A transitional stage of the insect life which characterized by a rapid growth and high food consumption.",["The larva (caterpillar)."]],["What Happens?","What happens if: The larva grows rapidly without its exoskeleton expanding?",["It can’t grow; it must molt (or it may die)."]],["Short Answer","State three characteristics of the butterfly’s body:",["3 body parts, 6 legs, 4 wings, 2 antennae."]]]]);
add(2,"Chapter 3 Assessment",[[["Give Reason","Give reason: seeds differ noticeably from each other in size, shape and color.",["Because they come from different types of plants."]],["Short Answer","Write what the following statement indicates: A main part of the plant directly responsible for capturing sunlight.",["The leaves."]],["What Happens?","What happens if: a plant’s stem is completely damaged?",["Water can’t reach the leaves, so the plant wilts and dies."]],["Compare","Compare between: the seed leaves (cotyledons) and the true leaves of the fava bean plant.",["Cotyledons store food; true leaves are green and make food."]]],[["Choose","Choose the correct answer: The part responsible for capturing the greatest possible amount of sunlight in the plant is:",["The broad, flat leaves.","The deep roots.","The strong stem.","The flowers"]],["Give Reason","Give reason: The stem is described as a passage or a vital transport network within the plant body.",["It carries water from the roots to all plant parts."]],["Short Answer","Mention the number of seed leaves (cotyledons) of the fava bean plant.",["Two"]],["What Happens?","What happens if: the new seeds fall on to the soil?",["They germinate into new plants (if conditions suit)."]],["Compare","Compare between: fava bean plant and sunflower plant (in terms of the best months of the year to plant them).",["Fava bean: autumn/winter (cool months, e.g. October-November). Sunflower: spring/summer (warm months, e.g. March-May)."]]],[["Complete","Complete the following statement: The plant mainly consists of three main parts ______, ______ and ______.",["roots, stem and leaves"]],["Give Reason","Give reason: Some Plant leaves are flat and wide.",["To capture more sunlight."]],["Short Answer","Give an example of a plant whose seed leaves (cotyledons) only two.",["Fava bean."]],["What Happens?","What happens if: a plant’s roots grow above the soil surface instead of extending beneath it?",["It can’t absorb water; plant dies."]],["Short Answer","Arrange the following plant growth stages: Flowers bloom / opening of flowers; Formation of buds; Growth of the stem and leaves; Fruit production",["1 Growth of the stem and leaves, 2 Formation of buds, 3 Flowers bloom / opening of flowers, 4 Fruit production."]]]]);
add(3,"Lessons 4-1/4-2",[[["What Happens?","What happens when: collecting sunlight using a magnifying glass onto a paper surface?",["It heats the paper until it burns."]],["Short Answer","What is wrong with the following behavior? A student looks directly toward the sun using a magnifying lens to test lighting intensity.",["It damages the eyes; never look at the Sun."]],["Short Answer","Give an example of: A rough surface that reflects light falling upon it in a scattered manner and in different directions.",["A sheet of paper (or wall, wood)."]],["Define","Define: Light Source:",["Anything that gives off light, e.g. the Sun."]]],[["Choose","Choose the correct answer: The bouncing back of light in straight lines when it touches a polished, solid surface represents the phenomenon of:",["Reflection","Refraction","Absorption","Emission"]],["Complete","Complete the statement: Light travels in ______ lines.",["straight"]],["Short Answer","Why do we scatter a small amount of starch in the place through which light passes?",["To see the path of light clearly."]],["What Happens?","What happens when: We use a magnifying glass to collect sunlight into a small point on a black paper?",["The black paper heats up and burns."]],["Short Answer","Mention two sources of light:",["the Sun and a lamp"]]],[["Choose","Choose the correct answer: The smaller the focused point of light became, it becomes ______",["More bright and hotter","Less bright and less hot","More bright and less hot","Less bright and hotter"]],["Complete","Complete the statement: Sunlight collects at a single high-temperature spot when using a ______ for a limited period of time.",["magnifying glass"]],["Define","What we call the bouncing back of light when it falls on a surface?",["Reflection of light."]],["Short Answer","Mention two things that should NOT be done when performing the light collection experiment.",["Don’t look directly at the Sun or the light spot. Don’t leave the paper burning without supervision."]],["Short Answer","Give an example of: a natural light source that emits light continuously.",["The Sun."]]]]);
add(3,"Lessons 4-3/4-4",[[["Choose","Choose the correct answer: A very long shadow of objects forms on the ground at: (Noon / Early Night / Early Morning / Midnight)",["Early Morning","Noon","Early Night","Midnight"]],["Short Answer","When does a shadow form?",["When an opaque object blocks light."]],["What Happens?","What happens if: The apparent position of Sun in the sky changes from East to West with respect to shadow extension?",["The shadow moves and changes direction and length."]],["Short Answer","Explain how we use an infrared thermometer.",["Point it at the surface, press the button and read the temperature."]]],[["Choose","Choose the correct answer: When we gradually move an opaque object away from a flashlight toward the wall, its shadow size: (Increases / Decreases / Doubles / Remains constant)",["Increases","Decreases","Doubles","Remains constant"]],["What Happens?","What happens if: Noon sunlight falls on a pole in the school yard?",["A very short shadow forms directly under the pole."]],["Define","Define the sundial.",["A tool that tells the time using the shadow of a stick."]],["Short Answer","What is the name of the tool used to measure the temperature of any place?",["Thermometer (or infrared thermometer)."]],["Give Reason","Give scientific reason: Ground in sunny place becomes warmer than ground in shaded locations.",["It receives direct sunlight and absorbs its heat."]]],[["Choose","Choose the correct answer: When Sun is at its highest point in the sky (Noon time), object shadows are: (Very long to the West / Very long to the East / Very short directly under the object)",["Very short directly under the object","Very long to the West","Very long to the East"]],["What Happens?","What happens if: Early morning sunlight falls on a pole in the school yard?",["A very long shadow forms on the opposite side (West)."]],["Give Reason","Give reason: Using an infrared thermometer.",["To measure surface temperature quickly without touching it."]],["Short Answer","What is the name of the tool used to tell time through changing shadow positions?",["Sundial."]],["What Happens?","Answer: If clouds suddenly disappear and the sky becomes Completely clear and sunny, what do you expect will happen to (shadow area on the ground)?",["Shadows become darker and sharper (clearer)."]]]]);
add(4,"Chapter 5 Assessment",[[["Choose","Choose the correct answer: When a drum membrane bounces up and down rapidly upon striking, this movement is called ______ (Rotation / Reflection / Vibration)",["Vibration","Rotation","Reflection"]],["What Happens?","What happens when we gently pluck a rubber band (regarding vibration distance)?",["It vibrates a short distance, so a faint (weak) sound is made."]],["Give Reason","Give reason: We must stay away from loud sounds.",["They can damage our ears."]],["Complete","Complete the following statement: Sound travels easily when the string is ______",["taut"]]],[["Choose","Choose the correct answer: Which action directly cut off the sound of a vibrating string on a musical instrument? (Increasing string tension / Holding the string with a finger / Plucking harder)",["Holding the string with a finger","Increasing string tension","Plucking harder"]],["Complete","Complete: Sound stops Completely in a string phone if the string is ______.",["loose"]],["Correct","Correct the statement: Sound vibrations travel through air only.",["Sound travels through air, liquids and solids."]],["What Happens?","What happens as the force with which we strike a musical membrane increases (such as drum).",["It vibrates more; louder sound."]]],[["Choose","Choose the correct answer: Bees produce a buzzing sound while flying due to wing vibration. If a bee lands on a flower and stops moving its wings, the sound ...... (Becomes louder / Stops immediately / Continues with same strength)",["Stops immediately","Becomes louder","Continues with same strength"]],["What Happens?","What happens when we pluck a rubber band with great force (regarding vibration distance)?",["It vibrates a long distance; loud sound."]],["Give Reason","Give reason: The harmful effects of using headphones for long periods.",["They can damage the ears."]],["Define","Define Vibration:",["Rapid back-and-forth movement."]]]]);
add(5,"Chapter 6 Assessment",[[["Choose","Choose the correct answer: When strong wind acting on a sail car, the force that effect on it .......... (increases / decreases )",["increases","decreases"]],["Complete","Complete: When sail size is small, it expose to a ______ amount of air, thus traveling a ______ distance.",["small; short"]],["True/False","Put (✓) or (✗): Wind force causes stationary objects to move, but cannot change their direction.",["✗ (False)","✓ (True)"]],["Give Reason","Give reason: A suitable sail size must be used to suit boat size.",["A sail that is too big or too small makes the boat hard to control."]],["What Happens?","What happens if: We increase electric fan speed facing a sail car from low to high speed? and Why?",["The car moves faster and farther, because the wind force increases."]]],[["Choose","Choose the correct answer: The factor that causes objects to move or stop is known as: (Distance / Size / Force).",["Force","Distance","Size"]],["Complete","Complete: As sail area exposed to wind increases, as ______",["the distance moved increases"]],["True/False","Put (✓) or (✗): A boat with a larger sail travels a shorter distance under the same wind compared to a boat with a smaller sail.",["✗ (False)","✓ (True)"]],["What Happens?","When making a wind-powered car, what happens when fan speed is set to low?",["The car moves a short distance (slowly)."]],["Give Reason","Give reason: Fishing boats on the Nile River equipped with large sails.",["To catch more wind, so they move farther and faster."]]],[["Choose","Choose the correct answer: If a car with a large sail moves 2m and 35cm, a car with a small sail is expected to move approximately............ (3m 55cm / 2m 35cm / 3m 10cm / 1m 35cm)",["1m 35cm","3m 55cm","2m 35cm","3m 10cm"]],["Complete","Complete: As wind force effect on a sailboat increases, as ______",["the distance moved increases"]],["True/False","Put (✓) or (✗): We can clearly see wind force with the naked eye touching objects to move them.",["✗ (False)","✓ (True)"]],["What Happens?","When making a wind-powered car, what happens when fan speed is set to high?",["The car moves faster and travels a long distance."]],["Compare","Compare between: Effect of Strong Wind and. Weak Wind on the object motion:",["Weak wind: short distance, small (weak) force. Strong wind: long distance, large (strong) force."]]]]);
add(6,"Chapter 7 Assessment",[[["Complete","Complete the following statement: Distance traveled by a projectile launched from a rubber band launcher depends on the amount of band ______ backward.",["stretch"]],["Correct","Correct underlined word in the following statement: a) To make a car travel longer, we use fewer rubber bands.",["To make a car travel longer, we use more rubber bands."]],["Correct","Correct underlined word in the following statement: b) As rubber band stretch increases, force acted on objects decreases.",["As rubber band stretch increases, force acted on objects increases."]],["What Happens?","What happens if: Using a very weak and thin rubber band instead of a thick, strong band in a ball launcher toy?",["The ball moves a shorter distance (weaker force)."]]],[["Complete","Complete the following statement: As rubber band stretch increases, as ______",["the force increases"]],["What Happens?","What happens to the object when the rubber band released after it contracts?",["It moves (is pushed) forward."]],["Correct","Correct underlined words in the following statement: Flight distance of a ball launched by rubber increases as pull-back distance decreases.",["…increases as pull-back distance increases."]],["Give Reason","Give reason: Using four rubber bands in a rubber band car makes it move faster than using just one band",["More bands give a bigger pushing force."]]],[["Complete","Complete the following statement: As the number of rubber bands increases, ______",["force increases"]],["Correct","Correct underlined words in the following statement: a) When leaving a rubber band on the table without stretching, it produces a large force.",["…it produces no (zero) force."]],["Correct","Correct underlined words in the following statement: b) Force generated by a rubber band increases when it is slack.",["…increases when it is stretched (taut)."]],["What Happens?","What happens when: Placing a light cotton ball in front of a rubber band, pulling backward a long distance and releasing it suddenly?",["The cotton ball is pushed forward a long distance, because the stretched band gives a large force."]]]]);
add(7,"Chapter 8 Assessment",[[["Complete","Complete the following statement: Water drains (leaks) very slowly in clay soil because its particles are ______ and the spaces between them are very small.",["very small"]],["Short Answer","Mention an examples of soil with large particles.",["Sandy soil."]],["What Happens?","What happens if: We try to agriculture in the desert without using special and advanced techniques to conserve water?",["Water drains away quickly and plants dry out and die."]],["Compare","Compare between: Sandy Soil and Clay Soil in terms of: (Water Drainage Speed )",["Clay soil: slow drainage. Sandy soil: fast drainage."]]],[["Complete","Complete the following statement: The speed of water drainage into the soil depends on the size of the ______ that make up the soil.",["particles"]],["Give Reason","Give reason: It is difficult for water to pass easily through clay soil particles.",["Its particles are very small with tiny spaces between them."]],["Short Answer","Answer the following question: Why do the spaces through which water passes differ between sandy soil and clay soil?",["Because their particle sizes are different."]],["Compare","Compare between: Desert Sand and Nile River Silt in terms of: (Ability to retain soluble nutrients in water).",["Desert sand: holds few nutrients (water drains away). River silt: holds many nutrients (keeps water)."]]],[["Complete","Complete the following statement: An example of soil with small particles is ______",["clay soil"]],["Give Reason","Give reason: When agriculture in the Egyptian desert, farmers are forced to use advanced and modern techniques to conserve water.",["Desert sandy soil loses water quickly and water is scarce in the desert."]],["Short Answer","Answer the following question: How does the tight cohesion (compactness) of soil particles affect the air spaces within it?",["Tightly packed particles leave very small air spaces, so the soil holds little air."]],["What Happens?","What happens if: An equal amount of water is poured at the exact same moment into two cups, one containing sand and the other containing clay?",["Water drains quickly through the sand, and slowly through the clay."]],["Compare","Compare between: Sandy Soil and Clay Soil in terms of: (Particle Size and Spaces Between Particles).",["Sandy soil: large particles, large spaces. Clay soil: very small (fine) particles, very small spaces."]]]]);

["An observation card starts with the date, so we know when we looked.","Bees visit flowers to drink nectar, so we find them near flower beds.","Pigeons are birds that live in trees. The lizard hides in burrows and under rocks from the sun’s heat.","Living things feed, breathe and grow (and move and reproduce). Rocks and water do none of these.","Animals and plants feed, breathe and grow, so they are living organisms.","Each place has its own food, water and heat. Only organisms that suit it can live there.","Rocks give shade and a cool, damp place. Lizards, beetles and ants like to hide there.","The record card is for science facts: the date, the organism’s name and where you found it, not your clothes.","A card records what, when and where: name, date and location. Shape and colour describe what you see.","A habitat is the organism’s home. It gives food, water and shelter.","Grass gives food and shade. Near it the ground is cooler and damp.","A magnifying glass makes small things look bigger. Move it slowly until the leaf looks clear.","Thin, light lines show small details clearly. Thick lines hide them.","The Sun is very bright and strong. Looking at it, even through a lens, can hurt your eyes.","Near the Nile the soil is wet, so we call it moist.","The desert is dry on top. Deep roots can reach water far under the ground.","Classification means sorting things into groups that are alike.","A jerboa is adapted to the dry desert, not to a place full of water, so it may not survive.","The desert is dry with little water; the Nile banks have a lot.","Fennec fox and jerboa have body features for the hot, dry desert.","These features help animals and plants stay alive where they live.","Adaptation is a body feature or behavior that helps a living thing survive.","An orange tree needs a lot of water. The desert is dry, so it dries out.","First look closely, then find what is the same, then make groups.","Aquatic means living in water, like the lotus.","Frogs and water birds need water and wet soil. The desert has little water.","Deep roots find water, small leaves lose less water, and thorns protect the plant.","You can sort by kind (plant or animal) or by place (water or desert).","Desert soil is dry and sandy. Nile soil is wet, muddy and has a lot of water.","The jerboa jumps on its long hind legs. Fennec fox has fur on its feet and big ears.","Desert animals rest in cool burrows in the day and come out at night when it is cooler.","The sand is very hot. Fur protects the soles like shoes.","The fennec fox has very big ears to lose heat. The jerboa’s ears are smaller.","Burrows are cool and shaded, so the animal avoids the hot sun and keeps water in its body.","Long hind legs let the jerboa jump far and fast away from enemies.","The jerboa gets water from plants and seeds, so it does not need to drink.","Without special features animals cannot cope with hot, dry weather.","The jerboa jumps on long hind legs. The fennec fox walks on sand with furry soles.","It rarely drinks. It gets water from the plants and seeds it eats.","Quick leaps keep its feet off the hot sand and help it run from enemies.","Big ears let body heat escape, so the fox stays cooler.","Midday is the hottest time. Animals would lose water and could get too hot.","In forests it is cooler, so small ears keep heat in. In the desert big ears let heat out."].forEach((w,n)=>{Q[22+n][5]=w});
["Mother insects lay eggs on the back of leaves, where they are hidden and the larvae can eat leaves when they hatch.","Larvae eat a lot to get energy and grow fast, and to store food for the pupa stage, when it does not eat.","A bee is an insect, so it has 6 legs. A butterfly body has 3 parts: head, thorax and abdomen.","The larva’s skin is tight and does not stretch. Without molting it cannot grow and may die.","The pupa rests: it does not move or eat. The adult moves, flies and drinks nectar.","The baby that comes out of the egg is the larva.","A bee has 4 wings (2 pairs). A butterfly has 2 antennae.","Insects hide their eggs under leaves, where they are safe from sun and enemies.","In a dry place there are no suitable plants, so the larva finds no food.","Insect eggs are different in shape, colour and size from one kind of insect to another.","Molting means shedding the old skin so the body can grow bigger.","A bee goes through 4 stages: egg, larva, pupa and adult. A butterfly has 2 eyes.","The larva eats and grows very fast.","A larva’s hard outer skin does not grow. It must molt, or it cannot grow and may die.","A butterfly is an insect: 3 body parts, 6 legs, 4 wings and 2 antennae.","Seeds come from different plants, so they have different sizes, shapes and colours.","Leaves are the part that catches sunlight to make food.","The stem carries water to the leaves. If it is damaged, the leaves get no water and the plant wilts.","Cotyledons are seed leaves that store food. True leaves are green and make food using sunlight.","Broad, flat leaves catch more sunlight than other parts.","The stem is like a pipe that carries water from the roots to all parts.","The fava bean seed splits into two halves. Each half is a cotyledon.","A seed that falls on the soil gets water and warmth, then germinates.","Fava beans like cool months. Sunflowers like warm months.","The three main parts are roots, stem and leaves.","A wide, flat leaf has a bigger surface to catch more sunlight.","Fava bean seeds have two cotyledons.","Roots must be in the soil to absorb water. Above ground they cannot, so the plant dries out.","First the stem and leaves grow, then buds form, then flowers open, then fruit appears.","Sunlight focused by the lens makes a hot spot, and the paper heats up until it burns.","The Sun is so bright that looking at it through a lens can seriously hurt your eyes.","A rough surface scatters light in many directions, like paper or a wall.","A light source gives off its own light, like the Sun.","A polished surface sends light back in straight lines. This is reflection.","Light always travels in straight lines.","Starch bits in the air show the light beam, so we can see its path.","Black paper takes in more heat, so it burns.","The Sun and a lamp both give out their own light.","A smaller spot has the same light in a smaller place, so it is brighter and hotter.","A magnifying glass collects sunlight into one hot spot.","Light bouncing back from a surface is called reflection.","The Sun can hurt your eyes and burning paper can start a fire. So be careful.","The Sun makes light all the time. It is a natural source.","In the early morning the Sun is low, so shadows are very long.","A shadow forms when an opaque object blocks the light.","As the Sun moves, the shadow moves to the other side and its length changes.","Point the thermometer at the surface, press the button, and read the number.","Moving the object away from the light and closer to the wall makes the shadow bigger.","At noon the Sun is right above, so the shadow is very short and under the pole.","A sundial uses a stick’s moving shadow to show the time.","A thermometer measures temperature. An infrared one measures a surface from far away.","Direct sunlight warms the ground, so sunny places are warmer than shaded places.","At noon the Sun is highest, so shadows are very short and under the object.","In the early morning the Sun is low in the East, so the shadow is long and falls to the West.","The infrared thermometer reads the temperature of a surface without touching it.","The shadow’s position changes with the Sun, so a sundial can show the time.","A sunny sky gives strong light, so the shadows are darker and sharper.","A drum skin moving up and down quickly is vibrating.","A gentle pluck makes a short vibration, so the sound is faint.","Very loud sounds can hurt our ears.","A tight (taut) string carries vibrations well.","A finger on the string stops its vibration, so the sound stops.","A loose string cannot carry vibrations, so no sound is heard.","Sound travels through air, liquids and solids, not only air.","A harder hit makes bigger vibrations, so the sound is louder.","No wing vibration means no sound, so the buzzing stops at once.","A hard pluck makes a long vibration, so the sound is loud.","Loud sound for a long time can hurt the ears.","Vibration is a fast back-and-forth movement.","Strong wind pushes with more force.","A small sail catches little air, so the car moves a short distance.","Wind can move still objects and can also change their direction. So it is false.","If the sail is the wrong size, the boat is hard to control.","A faster fan gives more wind force, so the car goes faster and farther.","A force makes things move or stop.","A bigger sail catches more wind, so the distance grows.","A big sail catches more wind and goes farther, not shorter. So it is false.","A slow fan gives weak wind, so the car goes a short distance.","Large sails catch more wind, so the boats go faster and farther.","A small sail moves less, so the distance is less than 2m 35cm. The answer is 1m 35cm.","Stronger wind means a bigger force, so the distance grows.","Wind is moving air. We cannot see it, only what it does to things. So it is false.","A high fan speed gives strong wind, so the car moves fast and far.","Weak wind gives a small force and a short distance. Strong wind gives a large force and a long distance.","The more you stretch the band, the farther the object goes.","More rubber bands give more force, so the car travels farther.","A more stretched band gives more force.","A weak band gives a small force, so the ball goes a short distance.","Stretching the band more gives more force.","When released, the band goes back to its shape and pushes the object forward.","Pulling back further gives more force, so the ball flies farther.","Four bands pull together, so the force is bigger.","More bands mean more force.","A band that is not stretched gives no force.","The band only gives force when it is stretched.","A long pull gives a large force, so the light ball goes far.","Clay has very small particles and tiny spaces, so water leaks slowly.","Sand is an example of soil with large particles.","Desert sand lets water drain away, so plants dry out and die.","Clay drains slowly and sand drains fast.","Water speed depends on the size of the particles.","Tiny spaces between clay particles make it hard for water to pass.","Sand and clay have different particle sizes, so their spaces are different.","Desert sand loses water and nutrients; river silt keeps both.","Clay has very small particles.","Sand loses water quickly and the desert has little water, so farmers must save water.","Tightly packed particles leave very small spaces for air.","Large spaces let water pass quickly through sand. Tiny spaces slow it in clay.","Sand has large particles and large spaces. Clay has very small particles and very small spaces."].forEach((w,n)=>{Q[65+n][5]=w});

/* ------------------------- multiple-choice options ------------------------- */
function opts(i){const q=Q[i],a=q[4][0];if(q[4].length>1)return shuf(q[4].slice());
 const picks=[];
 if(q[1]=='Correct'){const wrong=q[3].replace(/^[^:]*:\s*/,'').replace(/^[a-z]\)\s*/,'').trim();if(wrong&&norm(wrong)!=norm(a))picks.push(wrong)}
 let pool=Q.map((_,j)=>j).filter(j=>Q[j][0]!=q[0]&&Q[j][4].length==1&&Q[j][1]==q[1]);
 if(pool.length<4)pool=Q.map((_,j)=>j).filter(j=>Q[j][0]!=q[0]&&Q[j][4].length==1);
 pool=shuf(pool).slice(0,12).sort((x,y)=>Math.abs(Q[x][4][0].length-a.length)-Math.abs(Q[y][4][0].length-a.length));
 for(const j of pool){if(picks.length>=2)break;const t=Q[j][4][0];if(norm(t)!=norm(a)&&!picks.some(x=>norm(x)==norm(t)))picks.push(t)}
 return shuf([a,...picks])}

 '<div class="qc" dir="ltr"><div class="qtag"><i>'+LANDS[q[0]].e+' '+E(LANDS[q[0]].en)+'</i><i>'+q[1]+'</i><i>'+L[q[2]]+'</i>'+(q[7]?'<i>'+E(q[7])+'</i>':'')+'</div><div class="qt">'+W(q[3])+'</div>'+(q[8]&&SV[q[8]]?'<div class="ill">'+SV[q[8]]+'<small>Illustration made to help you (not from the book).</small></div>':'')+

  if(!paperQ&&q[4].length==1&&ok)h+='<div class="paper">'+(R.bonusDone?'✍️ ✔ Written!':'✍️ <b>Bonus:</b> write this answer on paper and show Mum: up to +20 🪙 <div class="row"><button class="mini" data-a="judge" data-t="bonus">I wrote it ✍️</button></div>')+'</div>';

  h+='<div class="row"><button class="mini" data-a="say" data-t="'+E((ok&&!paperQ?'':'The answer is: '+ans+'. ')+q[5]+' For example: '+q[6])+'">🔊 Explain</button><span style="flex:1"></span><button class="btn" data-a="next">Next ▶</button></div></div>'}
 return h+'</div>'}
function paperCard(R,i,q){if(R.picked!=null)return '';

  if(g=='again'){p.bad[i]=1;delete p.ok[i];R.wrong++;R.combo=0;R.wrongIds.push(i);sfx.no()}
  else{if(p.bad[i]){delete p.bad[i];p.fixed++}p.ok[i]=1;R.right++;R.combo++;sfx.ok()}}

function applyEndLocal(){const p=P(),st=normSt(O.stats[api&&api.uid]);if(!p||!O.code||OLS.get('done_'+O.code))return;OLS.set('done_'+O.code,'1');if(st.score>0){p.gold+=st.score;save();setTimeout(()=>{toast('🏰 +'+st.score+' 🪙 '+tr('added to your kingdom at home!','أُضيفت إلى مملكتك في البيت!'));confetti('🪙')},1200)}checkBadges()}

 return '<h2>🌐 '+tr('Play Online','العب عبر الإنترنت')+'</h2><p class="note">'+tr('Each player answers on her own phone. Mum\'s phone is the referee 👩‍⚖️: it shows the questions, checks the written answers and gives the gold.','كل لاعبة تجيب من هاتفها، وهاتف ماما هو الحَكَم 👩‍⚖️: يعرض الأسئلة ويصحّح الإجابات المكتوبة ويوزّع الذهب.')+'</p>'+
 (O.err?'<div class="card" style="background:var(--no-l)">⚠️ '+E(O.err)+'</div>':'')+(O.busy?'<div class="card">⏳ '+tr('Connecting…','جارٍ الاتصال…')+'</div>':'')+
 (hc?'<button class="land" data-a="oresume"><span class="em" style="background:#efe8ff">👩‍⚖️</span><span class="tx"><b>'+tr('Back to my room ','العودة إلى غرفتي ')+hc+'</b><small>'+tr('You are the referee','أنتِ الحَكَم')+'</small></span></button>':'')+
 (jc?'<button class="land" data-a="oreturn"><span class="em" style="background:#e5f3fc">🎮</span><span class="tx"><b>'+tr('Back to the game ','العودة إلى اللعبة ')+jc+'</b><small>'+tr('Continue as a player','المتابعة كلاعبة')+'</small></span></button>':'')+
 '<div class="card"><h3>🧒 '+tr('I am a player','أنا لاعبة')+'</h3><input type="text" id="ocode" maxlength="6" placeholder="'+tr('Room code','كود الغرفة')+'" value="'+E(code)+'" style="text-transform:uppercase;letter-spacing:4px;font-weight:800;direction:ltr;text-align:center"><div style="height:8px"></div><input type="text" id="oname" maxlength="16" placeholder="'+tr('Your name','اسمك')+'" value="'+E(OLS.get('name')||(p?p.name:''))+'"><div class="avs" style="margin-top:8px">'+[...new Set([...(p?[p.av]:[]),...START_AVS])].map(e=>'<button class="'+((VA.oav||(p?p.av:START_AVS[0]))==e?'on':'')+'" data-a="oav" data-t="'+e+'">'+e+'</button>').join('')+'</div><div class="row"><button class="btn" data-a="ojoin">'+tr('Join','انضمّي')+' ▶</button></div></div>'+
 '<div class="card"><h3>👩‍⚖️ '+tr('I am the referee (Mum)','أنا الحَكَم (ماما)')+'</h3><p class="note">'+tr('Lands:','الأراضي:')+'</p><div class="row">'+LANDS.map((l,c)=>'<button class="mini'+(!OSET.m&&OSET.chs.includes(c)?' on':'')+'" data-a="och" data-i="'+c+'">'+l.e+' '+(c+1)+'</button>').join('')+'</div><p class="note">'+tr('…or a monthly assessment:','…أو تقييم شهري:')+'</p><div class="row">'+BOSSES.map(b=>'<button class="mini'+(OSET.m==b.m?' on':'')+'" data-a="om" data-i="'+b.m+'">'+b.e+' '+tr('Monthly ','الشهري ')+b.m+'</button>').join('')+'</div>'+
 '<p class="note">'+tr('Questions per round:','أسئلة كل جولة:')+'</p>'+pick2('per',0,[5,8,10])+'<p class="note">'+tr('Rounds (building time after each round):','الجولات (وقت للبناء بعد كل جولة):')+'</p>'+pick2('rounds',0,[1,2,3,4])+'<p class="note">'+tr('Seconds per question:','ثوانٍ لكل سؤال:')+'</p>'+pick2('time',0,[20,30,45,60])+

 '<div class="row"><button class="btn gold" data-a="ocreate">'+tr('Create room','إنشاء غرفة')+' ▶</button></div></div><p class="note">'+tr('Needs internet. Uses the same online server as Dream Kingdom.','يحتاج إلى إنترنت، ويستخدم خادم «مملكة الأحلام» نفسه.')+'</p>'}
function plist(showAns){const m=O.meta||{};return Object.entries(O.players).map(([u,pl])=>({u,pl,st:normSt(O.stats[u]),k:normK(O.kings[u])})).sort((a,b)=>b.st.score-a.st.score).map((x,n)=>'<div class="lb"><b style="width:24px">'+(m.status=='end'?(['🥇','🥈','🥉'][n]||n+1):(x.pl.online===false?'⚪':'🟢'))+'</b><span class="ie">'+E(x.pl.av||'🙂')+'</span><span class="grow"><b>'+E(x.pl.name)+'</b><br><small class="note">⭐ '+x.st.score+' · 🪙 '+x.k.gold+' · ✍️ '+x.st.written+' · 🏰 '+Object.values(x.k.b).reduce((a,b)=>a+b,0)+'</small></span>'+(showAns?'<span>'+(O.answers[x.u]?'✅':'⏳')+'</span>':'')+'</div>').join('')||'<p class="note">'+tr('No players yet…','لا توجد لاعبات بعد…')+'</p>'}
function qBlock(q){return '<div class="qtag"><i>'+LANDS[q.ch].e+' '+E(LANDS[q.ch].en)+'</i><i>'+E(q.type)+'</i>'+(q.label?'<i>'+E(q.label)+'</i>':'')+'<i>'+q.n+'/'+q.total+'</i></div><div class="qt">'+W(q.text)+'</div>'+(q.ill&&SV[q.ill]?'<div class="ill">'+SV[q.ill]+'</div>':'')}
function hostV(){const m=O.meta;if(!m||O.role!='host')return onlineV();const q=O.q,r=O.rev,link=location.origin+location.pathname+'?room='+O.code;
 let h='<div class="card" style="text-align:center"><small class="note">'+tr('Room code','كود الغرفة')+' · '+E(m.title||'')+'</small><div style="font-size:38px;font-weight:900;letter-spacing:6px;direction:ltr">'+O.code+'</div><div class="row" style="justify-content:center"><button class="mini" data-a="ocopy" data-t="'+E(link)+'">📋 '+tr('Copy link','نسخ الرابط')+'</button><a class="mini" style="text-decoration:none" target="_blank" href="https://wa.me/?text='+encodeURIComponent(tr('Join our Science Kingdom game! ','انضمّي إلى لعبة مملكة العلوم! ')+link)+'">💬 WhatsApp</a></div><small class="note">'+tr('Round ','الجولة ')+(m.round||0)+'/'+m.rounds+' · '+tr('Question ','السؤال ')+(m.qn||0)+'/'+H.deck.length+'</small></div>';
 const pend=Object.entries(H.pend);if(pend.length)h+='<div class="card" style="background:#fff7e0"><h3>⚖️ '+tr('Challenges to approve','تحديات تنتظر الاعتماد')+'</h3>'+pend.map(([k,r2])=>{const pl=O.players[r2.uid]||{},qq=Q[r2.i]||Q[0];return '<div class="wk"><b>'+E(pl.av||'')+' '+E(pl.name||'?')+'</b> '+tr('wrote the correct answer 2 times:','كتبت الإجابة الصحيحة مرتين:')+'<div class="ltr note">'+E(qq[4][0])+'</div><div class="row"><button class="btn gold" data-a="ofok" data-t="'+k+'">✅ +10🪙</button><button class="btn alt" data-a="ofno" data-t="'+k+'">🔁 '+tr('Not yet','ليس بعد')+'</button></div></div>'}).join('')+'</div>';
 if(m.status=='lobby')h+='<div class="card"><h3>👥 '+tr('Players','اللاعبات')+'</h3>'+plist()+'<div class="row"><button class="btn" data-a="onext"'+(Object.keys(O.players).length?'':' disabled')+'>▶ '+tr('Start the game','ابدئي اللعبة')+'</button></div></div>';
 else if(m.status=='question'&&q){const c=H.cur&&H.cur.qKey==q.qKey?H.cur:null;h+='<div class="qc" dir="ltr"><div class="row" style="margin:0 0 6px"><span class="timer">⏱ <span id="otm">'+Math.max(0,Math.ceil((q.endsAt-api.now())/1000))+'</span></span><span class="chip">'+Object.keys(O.answers).length+'/'+Object.keys(O.players).length+' ✅</span></div>'+qBlock(q)+(q.paper?'<div class="paper">✍️ <b>Paper question.</b> The players are writing on paper.<br><small>Referee only — model answer:</small><br><b>'+E(Q[q.i][4][0])+'</b></div>':(q.opts||[]).map((o,n)=>'<div class="opt'+(c&&n==c.correct?' g':'')+'">'+E(o)+(c&&n==c.correct?' ✔':'')+'</div>').join('')+'<small class="note">✔ Referee only</small>')+'</div><div class="card">'+plist(true)+'<div class="row"><button class="btn" data-a="oreveal">👁 '+tr('Show the answer now','اكشفي الإجابة الآن')+'</button></div></div>'}
 else if(m.status=='reveal'&&r){const res=r.res||{};h+='<div class="qc" dir="ltr">'+(q?qBlock(q):'')+'<div class="fb ok"><b>✅ '+E(r.ans)+'</b><p>💡 '+W(r.why)+'</p></div></div><div class="card"><h3>'+(r.paper?'👩‍⚖️ '+tr('Check each paper','صحّحي كل ورقة'):'📊 '+tr('Results','النتائج'))+'</h3>'+
  Object.entries(O.players).map(([u,pl])=>{const x=res[u];let right;if(r.paper){right=!x?'<small class="note">'+tr('did not write','لم تكتب')+'</small>':x.gr?'<b>'+OGR[x.gr][0]+' +'+x.g+'</b>':'<div class="row" style="margin:4px 0 0">'+Object.keys(OGR).map(g=>'<button class="mini" data-a="ograde" data-u="'+u+'" data-t="'+g+'">'+OGR[g][0]+'</button>').join('')+'</div>'}else right=x&&x.ok?'✅ +'+x.g+' 🪙':'❌';return '<div class="wk"><b>'+E(pl.av||'')+' '+E(pl.name)+'</b> '+right+'</div>'}).join('')+
  '<div class="row"><button class="btn" data-a="onext">'+((m.qn||0)>=H.deck.length?'🏁 '+tr('Final results','النتائج النهائية'):(m.qn||0)%m.per==0?'🏰 '+tr('End round: build time','نهاية الجولة: وقت البناء'):tr('Next question','السؤال التالي')+' ▶')+'</button></div></div>'}
 else if(m.status=='build')h+='<div class="card"><h3>🏰 '+tr('Building time! Round ','وقت البناء! انتهت الجولة ')+m.round+'</h3><p class="note">'+tr('The players are building their kingdoms from their phones.','اللاعبات يبنين ممالكهن من هواتفهن.')+'</p>'+plist()+'<div class="row"><button class="btn" data-a="onext">▶ '+tr('Start round ','ابدئي الجولة ')+((m.round||0)+1)+'</button></div></div>';
 else if(m.status=='end')h+='<div class="card res"><div class="big">🏆</div><h2>'+tr('Final results','النتائج النهائية')+'</h2></div><div class="card">'+plist()+'</div>';
 else h+='<div class="card">⏳</div>';
 return h+'<div class="row">'+(m.status!='end'&&m.status!='lobby'?'<button class="btn alt" data-a="oend">🏁 '+tr('End game','إنهاء اللعبة')+'</button>':'')+'<button class="btn alt" data-a="oclose">🗑️ '+tr('Close room','إغلاق الغرفة')+'</button></div>'}
function playerV(){const m=O.meta;if(!m||O.role!='player')return onlineV();const u=api.uid,me=O.players[u]||{},st=normSt(O.stats[u]),k=normK(O.kings[u]),q=O.q,r=O.rev;
 let h='<div class="top"><span class="chip">'+E(me.av||'')+' '+E(me.name||'')+'</span><span class="chip">⭐ '+st.score+'</span><span class="chip">🪙 '+k.gold+'</span><span class="chip">✍️ '+st.written+'</span><span class="grow"></span><small class="note" dir="ltr">'+O.code+'</small></div>';
 if(m.status=='lobby')h+='<div class="card res"><div class="big">⏳</div><h3>'+tr('Waiting for the referee to start…','ننتظر الحَكَم ليبدأ…')+'</h3></div><div class="card">'+plist()+'</div>';
 else if(m.status=='question'&&q){const mine=O.my[q.qKey];h+='<div class="qc" dir="ltr"><div class="row" style="margin:0 0 6px"><span class="timer">⏱ <span id="otm">'+Math.max(0,Math.ceil((q.endsAt-api.now())/1000))+'</span></span></div>'+qBlock(q)+
  (q.paper?(mine?'<div class="paper">✔ Sent! When the time ends, compare your paper with the model answer.</div>':'<div class="paper">✍️ <b>Paper question!</b><br>Write your answer on paper. Then tap the button. The referee will check it!<div class="row"><button class="btn" data-a="owrote">I wrote it ✍️</button></div></div>'):
  (q.opts||[]).map((o,n)=>'<button class="opt'+(mine?(mine.c===n?' g':' dim'):'')+'" data-a="oans" data-i="'+n+'">'+E(o)+'</button>').join('')+(mine?'<p class="note">✔ Answer sent. Wait for the others…</p>':''))+'</div>'}
 else if(m.status=='reveal'&&r){const x=(r.res||{})[u];h+='<div class="qc" dir="ltr">'+(q?qBlock(q):'');
  if(r.paper){h+='<div class="paper"><b>📖 Model answer:</b><p class="big-a">'+W(r.ans)+'</p><b>🔎 Did you write these words correctly?</b><div class="row">'+kw(r.ans).map(w=>'<button class="kwc" data-a="kwc">'+E(w)+'</button>').join('')+'</div></div>'+(!x?'<p class="note">You did not send a paper answer this time.</p>':x.gr?'<div class="fb '+(x.gr=='again'?'no':'ok')+'"><b>👩‍⚖️ '+OGR[x.gr][0]+' +'+x.g+' 🪙</b></div>':'<div class="fb ok">👩‍⚖️ The referee is checking your paper… show it to her!</div>')}
  else{h+=(q&&q.opts||[]).map((o,n)=>'<div class="opt'+(n===r.c?' g':x&&x.c===n?' r':' dim')+'">'+E(o)+'</div>').join('')+'<div class="fb '+(x&&x.ok?'ok':'no')+'"><b>'+(x&&x.ok?'🌟 Correct! +'+x.g+' 🪙':x&&!x.none?'💪 Good try!':'⏰ No answer this time.')+'</b>'+(x&&x.ok?'':'<p><b>'+W(r.ans)+'</b></p>')+'<p>💡 '+W(r.why)+'</p><p>🌍 '+W(r.ex)+'</p>'+
   (x&&!x.ok?'<div class="paper">'+(O.forf[r.qKey]?'⚖️ ✔ Sent! Show your paper to the referee.':'⚖️ <b>Referee’s challenge:</b> write the correct answer on paper 2 times and show the referee. +10 🪙<div class="row"><button class="mini" data-a="oforf">I did it ✍️</button></div>')+'</div>':'')+'</div>'}
  h+='</div>'}
 else if(m.status=='build')h+='<div class="card"><h3>🏰 '+tr('Building time!','وقت البناء!')+'</h3><p class="note">'+tr('Spend your game gold on your online kingdom.','اصرفي ذهب اللعبة على مملكتك في هذه اللعبة.')+'</p></div><div class="kmap">'+BLD.map(b=>{const lv=k.b[b.id]||0,rq=oreq(k,b);return '<button class="plot'+(lv?' on':'')+(rq&&rq.can?' can':'')+'" data-a="oplot" data-i="'+b.id+'"><span class="pe">'+(lv?b.e[lv-1]:'🏗️')+'</span><b>'+tr(b.en,b.ar)+'</b><small>'+(lv?tr('Level ','المستوى ')+lv:'')+'</small></button>'}).join('')+'</div><p class="note">⏳ '+tr('The referee will start the next round.','الحَكَم سيبدأ الجولة التالية.')+'</p>';
 else if(m.status=='end')h+='<div class="card res"><div class="big pop">🏆</div><h2>'+tr('Game over!','انتهت اللعبة!')+'</h2>'+(P()?'<p>🏰 '+tr('Your score was added as gold to your kingdom at home.','أُضيفت نقاطك ذهبًا إلى مملكتك في البيت.')+'</p>':'')+'</div><div class="card">'+plist()+'</div>';
 else h+='<div class="card">⏳</div>';
 return h+'<div class="row"><button class="btn alt" data-a="oleave">🚪 '+tr('Leave','خروج')+'</button></div>'}
function oplotSheet(id){const k=normK(O.kings[api.uid]),b=BLD.find(x=>x.id==id),lv=k.b[id]||0,r=oreq(k,b);
 sheet('<h2>'+(lv?b.e[lv-1]:'🏗️')+' '+tr(b.en,b.ar)+'</h2><p>'+tr(b.d[0],b.d[1])+'</p>'+(r?'<ul class="req">'+r.need.map(x=>'<li>'+(x.ok?'✅':'⬜')+' '+x.t+'</li>').join('')+'</ul><div class="row"><button class="btn gold" data-a="obuild" data-i="'+id+'"'+(r.can?'':' disabled')+'>🔨 '+(lv?tr('Upgrade','طوّري'):tr('Build','ابني'))+'</button></div>':'<p>👑 '+tr('Max level!','أعلى مستوى!')+'</p>')+'<div class="row"><button class="btn alt" data-a="sheetx">'+tr('Close','إغلاق')+'</button></div>')}

/* ------------------------- online events ------------------------- */
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,i=b.dataset.i,t=b.dataset.t;
 if(a=='och'){OSET.m=0;const c=+i;OSET.chs=OSET.chs.includes(c)?OSET.chs.filter(x=>x!=c):OSET.chs.concat(c).sort();remember()}
 else if(a=='om'){OSET.m=OSET.m==+i?0:+i;remember()}
 else if(a=='oset'){OSET[t]=+i;remember()}
 else if(a=='oav'){VA.oav=t;keep(()=>draw())}
 else if(a=='ocreate')hostCreate();else if(a=='oresume')hostResume();else if(a=='oreturn')rejoin();else if(a=='ojoin')joinRoom();
 else if(a=='onext')hostNext().catch(er=>toast('⚠️ '+(er.message||er)));else if(a=='oreveal')hostReveal();
 else if(a=='ograde')hostGrade(b.dataset.u,t).catch(er=>toast('⚠️ '+(er.message||er)));
 else if(a=='ofok')hostForfeit(t,true);else if(a=='ofno')hostForfeit(t,false);
 else if(a=='oend'){if(confirm(tr('End the game now?','إنهاء اللعبة الآن؟')))hostEnd()}else if(a=='oclose')hostClose();
 else if(a=='ocopy'){try{navigator.clipboard.writeText(t);toast(tr('Link copied ✅','تم نسخ الرابط ✅'))}catch(er){prompt('',t)}}
 else if(a=='oans')sendAns({c:+i});else if(a=='owrote')sendAns({n:1});
 else if(a=='oforf'){const r=O.rev;if(!r||O.forf[r.qKey])return;O.forf[r.qKey]=1;rd();api.push(RP('requests'),{uid:api.uid,t:'forfeit',q:r.qKey,i:r.i,at:api.TS}).catch(er=>{delete O.forf[r.qKey];rd();toast('⚠️ '+(er.message||er))})}
 else if(a=='oplot')oplotSheet(i);
 else if(a=='obuild'){closeSheet();api.push(RP('requests'),{uid:api.uid,t:'build',b:i,at:api.TS}).catch(er=>toast('⚠️ '+(er.message||er)));sfx.build()}
 else if(a=='oleave'){if(confirm(tr('Leave the game?','الخروج من اللعبة؟')))leaveRoom()}});
function keep(f){const c=($('#ocode')||{}).value,n=($('#oname')||{}).value;f();if($('#ocode')&&c!=null)$('#ocode').value=c;if($('#oname')&&n!=null)$('#oname').value=n}
function remember(){OLS.set('set',JSON.stringify(OSET));keep(()=>draw())}

/* ------------------------- start ------------------------- */
if(OQS.get('room')&&!OLS.get('host')){V='online'}
daily();draw();
</script></body></html>
